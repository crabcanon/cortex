          title: Supported Synthesis Types
          type: array
      required:
        - engine_id
        - display_name
        - availability_status
      title: SynthesisEngineDescriptor
      type: object
    SynthesisEngineList:
      properties:
        engines:
          items:
            $ref: '#/components/schemas/SynthesisEngineDescriptor'
          title: Engines
          type: array
        generated_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Generated At
      required:
        - engines
      title: SynthesisEngineList
      type: object
    SynthesisJobAccepted:
      properties:
        cancel_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Cancel Url
        engine_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Engine Id
        job_id:
          title: Job Id
          type: string
        job_type:
          $ref: '#/components/schemas/JobType'
        poll_url:
          title: Poll Url
          type: string
        result_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Result Url
        status:
          $ref: '#/components/schemas/JobStatus'
        submitted_at:
          format: date-time
          title: Submitted At
          type: string
        synthesis_type:
          anyOf:
            - $ref: '#/components/schemas/SynthesisType'
            - type: 'null'
        telemetry:
          anyOf:
            - $ref: '#/components/schemas/TelemetryContext'
            - type: 'null'
      required:
        - job_id
        - job_type
        - status
        - submitted_at
        - poll_url
      title: SynthesisJobAccepted
      type: object
    SynthesisJobSubmitRequest:
      properties:
        config:
          $ref: '#/components/schemas/SynthesisConfig'
        engine_id:
          default: auto
          title: Engine Id
          type: string
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        output:
          $ref: '#/components/schemas/SynthesisOutputOptions'
        profile_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile Key
        source:
          $ref: '#/components/schemas/SynthesisSource'
        synthesis_type:
