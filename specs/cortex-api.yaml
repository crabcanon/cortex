  /v1/parse/sync:
    post:
      tags:
        - Parse
      summary: Parse content synchronously / 同步解析内容
      description: Synchronously parse one or more source locators into LLM-ready Markdown through a unified public contract. Most callers only need `sources` plus `engine_id`; `engine_id=auto` lets Cortex choose the best active engine and scene for each source. / 通过统一公共契约同步解析一个或多个来源，并输出 LLM-ready Markdown；大多数调用方只需要提供 `sources` 与 `engine_id`，当 `engine_id=auto` 时，Cortex 会为每个来源自动选择最佳激活引擎与场景。
      operationId: parseContentSync
      security:
        - OAuth2:
            - parse:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseSubmitRequest'
            examples:
              autoWebBatchParse:
                summary: Auto-routed web batch parse / 自动路由网页批量解析
                description: |
                  Submit one or more source locators and let Cortex choose the best active engine and scene automatically.
                  提交一个或多个来源，由 Cortex 自动选择最佳激活引擎与场景。
                value:
                  sources:
                    - https://docs.cognee.ai/core-concepts/overview
                    - https://docs.crawl4ai.com/advanced/advanced-features/
                  engine_id: auto
              crawl4aiDeepWeb:
                summary: Crawl4AI deep-web parse / Crawl4AI 深度网页解析
                description: |
                  Explicitly use Crawl4AI with the high-intensity deep_web scene; fallback is disabled for explicit engines.
                  显式指定 Crawl4AI 与 deep_web 场景；显式 engine 不会沿用 auto fallback。
                value:
                  sources:
                    - https://docs.crawl4ai.com/advanced/advanced-features/
                  engine_id: crawl4ai
                  scene: deep_web
              minioObjectAuto:
                summary: MinIO/S3 object parse / MinIO/S3 对象解析
                description: |
                  Parse a Cortex-managed object in MinIO/S3. Cortex extracts the obj_... segment, signs a download URL, and detects MIME type.
                  解析已上传到 Cortex Storage 的 MinIO/S3 对象；Cortex 会自动提取 obj_...、签发下载 URL 并侦测 MIME。
                value:
                  sources:
                    - s3://cortex-local/tenant_demo/obj_a3da967e3ca446cab3631bb7/bofa_note.pdf
                  engine_id: auto
                  scene: document_ai
      responses:
        '200':
          description: Parse completed within the sync timeout budget. / 在同步超时预算内完成解析。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Request must be handled asynchronously. / 请求需要改为异步处理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/parse/jobs:
    post:
      tags:
        - Parse
      summary: Submit an asynchronous parse job / 提交异步解析作业
      description: Queue one asynchronous parse job per source using the same unified public Parse contract. Add optional `priority` and `webhook` only when job control is needed. / 基于统一的公共 Parse 契约，为每个来源排入一个异步解析作业；仅在需要作业控制时再补充 `priority` 与 `webhook`。
      operationId: createParseJob
      security:
        - OAuth2:
            - parse:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseJobSubmitRequest'
            examples:
              asyncAutoBatchParse:
                summary: Async auto-routed batch parse / 异步自动路由批量解析
                description: |
                  Recommended when you want one async parse job per source with the same high-level routing contract.
                  当你希望每个来源各自生成一个异步解析作业，同时仍使用统一高层路由契约时，推荐该模式。
                value:
                  sources:
                    - https://docs.cognee.ai/core-concepts/overview
                    - s3://demo-bucket/manuals/architecture.pdf
                  engine_id: auto
                  scene: deep_web
                  priority: 5
                  webhook:
                    url: https://example.com/hooks/cortex/parse
                    secret_ref: vault:cortex/webhooks/parse
                    event_types:
                      - job.succeeded
                      - job.failed
                    headers:
                      X-Consumer: knowledge-pipeline
              asyncDoclingMinioPdf:
                summary: Docling async MinIO PDF parse / Docling 异步解析 MinIO PDF
                description: |
                  Use this for PDFs uploaded through Cortex Storage. Start the docling parse worker so the job is claimed by the Docling runtime worker.
                  用于解析已上传到 Cortex Storage 的 PDF；需要启动 docling parse worker，让任务被 Docling 运行时 worker 领取。
                value:
                  sources:
                    - s3://cortex-local/tenant_demo/obj_a3da967e3ca446cab3631bb7/bofa_note.pdf
                  engine_id: docling
                  scene: document_ai
                  priority: 5
              asyncLlamaParseMinioPdf:
                summary: LlamaParse async MinIO PDF parse / LlamaParse 异步解析 MinIO PDF
                description: |
                  Use this when LlamaParse cloud credentials are configured and the object should be parsed by the cloud document parser.
                  当已配置 LlamaParse 云端凭据，且希望使用云端文档解析器时使用。
                value:
                  sources:
                    - cortex-local/tenant_demo/obj_a3da967e3ca446cab3631bb7/bofa_note.pdf
                  engine_id: llama_parse
                  scene: document_fidelity
                  priority: 5
      responses:
        '202':
          description: Parse job accepted. / 已接受解析作业。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseBatchJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/parse/jobs/{jobId}/result:
