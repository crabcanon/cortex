[project]
name = "cortex-worker-synthesis"
version = "0.1.0"
description = "Synthesis worker for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "cortex-common",
  "cortex-contracts",
  "cortex-db",
  "cortex-domain",
  "cortex-storage",
  "cortex-synthesis",
]

[project.optional-dependencies]
runtime = [
  "cortex-synthesis[runtime]",
]

[project.scripts]
cortex-synthesis-worker = "cortex_worker_synthesis.main:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
