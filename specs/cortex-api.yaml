        experiment_variant:
          anyOf:
            - type: string
            - type: 'null'
          title: Experiment Variant
        request_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Request Id
        span_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Span Id
        trace_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Trace Id
      title: TelemetryContext
      type: object
    UploadMode:
      enum:
        - single_part
        - multipart
      title: UploadMode
      type: string
    UploadSessionStatus:
      enum:
        - pending_upload
      title: UploadSessionStatus
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object
    WebhookConfig:
      properties:
        event_types:
          description: 'Optional event types to send. Best default: empty list, which means the service
            default set.'
          examples:
            - - job.succeeded
              - job.failed
          items:
            type: string
          title: Event Types
          type: array
        headers:
          additionalProperties:
            type: string
          description: 'Optional static headers sent with the webhook. Best default: empty object.'
          examples:
            - X-Consumer: knowledge-pipeline
          title: Headers
          type: object
        secret_ref:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional secret reference used to sign or authenticate webhook delivery. Best
            default: omit.'
          examples:
            - vault:cortex/webhooks/parse
          title: Secret Ref
        url:
          description: Required callback URL invoked on job lifecycle events.
          examples:
            - https://example.com/hooks/cortex/parse
          title: Url
          type: string
      required:
        - url
      title: WebhookConfig
      type: object
  securitySchemes:
    BearerAuth:
      description: Bearer access token for protected Cortex APIs.
      scheme: bearer
      type: http
info:
  description: Cortex 通过统一契约暴露五类核心 API：Parse、Storage、Knowledge、Evaluation、Synthesis。各域共享厂商中立的数据模型、统一的
    Job 体系、统一权限边界，以及基于 OpenTelemetry 的可观测能力。
  summary: 面向数据解析、存储、知识构建、效果评测与数据合成的厂商中立 API。 / Vendor-neutral APIs for parse, storage, knowledge, evaluation,
    and synthesis.
  title: Cortex API
  version: 0.0.1
openapi: 3.1.0
paths:
  /metrics:
    get:
      operationId: getMetrics
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response / 成功响应
      summary: Prometheus scrape endpoint / Prometheus 抓取端点
      tags:
        - Observability
  /v1/dev/auth/token:
    post:
      description: Available only when `CORTEX_ENV=local` and `CORTEX_AUTH_MODE=dev`. Issues a local `dev:`
        bearer token for Swagger UI, curl, and smoke tests. This route is not mounted in non-local deployments.
        / 仅当 `CORTEX_ENV=local` 且 `CORTEX_AUTH_MODE=dev` 时才会暴露。该接口用于生成本地 `dev:` Bearer token，便于 Swagger、curl
        和冒烟测试使用；在非本地部署中不会挂载。
      operationId: issueLocalDevAccessToken
      requestBody:
        content:
          application/json:
            examples:
              minimal_local_token:
                description: Only `subject` and `tenant_id` are required. Cortex fills in the standard
                  local developer scopes automatically. / 只需要 `subject` 和 `tenant_id`，其余标准本地开发 scope 由
                  Cortex 自动补齐。
                summary: Minimal local token request / 最小化本地令牌请求
                value:
                  subject: smoke-test
                  tenant_id: tenant_demo
              recommended_swagger_token:
                description: Creates a local development bearer token that can be pasted directly into
                  Swagger UI's `Authorize` dialog. / 生成一个可直接粘贴到 Swagger UI `Authorize` 弹窗中的本地开发 Bearer
                  token。
                summary: Recommended Swagger dev token / 推荐的 Swagger 开发令牌
                value:
                  client_id: swagger-ui
                  display_name: Alice
                  expires_in: 3600
                  groups:
                    - platform-ops
                  roles:
                    - tenant_admin
                  subject: alice
                  tenant_id: tenant_demo
            schema:
              $ref: '#/components/schemas/LocalDevTokenIssueRequest'
              description: Local development token request. In the simplest case only `subject` and `tenant_id`
                are required. / 本地开发令牌请求，最简单时只需要填写 `subject` 和 `tenant_id`。
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalDevTokenIssueResponse'
          description: Local development token issued. / 已签发本地开发令牌。
        '422':
          description: Validation error. / 请求体验证失败。
      summary: Issue local development access token / 签发本地开发访问令牌
      tags:
        - Dev Auth
  /v1/eval/engines:
    get:
      description: Returns the currently registered evaluation engines, supported evaluation types, execution
        modes, and default profile hints. / 返回当前注册的评测引擎、支持的评测类型、执行模式和默认配置文件提示。
      operationId: listEvalEngines
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalEngineList'
          description: Successful Response / 成功响应
      security:
        - BearerAuth: []
      summary: List evaluation engines / 列出评测引擎
      tags:
        - Evaluation
  /v1/eval/jobs:
    post:
      description: Queues a longer-running evaluation workload and returns a Cortex job handle for polling,
        events, and result retrieval. / 排队一个运行时间较长的评测工作负载，并返回一个 Cortex 作业句柄用于轮询、事件和结果检索。
      operationId: createEvalJob
      parameters:
        - description: Optional idempotency key for asynchronous evaluation job submission.
          in: header
          name: Idempotency-Key
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Optional idempotency key for asynchronous evaluation job submission.
            examples:
              - parse-demo-001
            title: Idempotency-Key
      requestBody:
        content:
          application/json:
            examples:
              agent_eval_job:
                description: Recommended async submission for larger agentic or regression workloads.
                summary: Agent evaluation job / Agent 评测作业
                value:
                  engine_id: auto
                  eval_type: agentic
                  input:
                    dataset_id: ds_agent_suite
                    type: dataset
                  metrics:
                    - metric_key: agent.task_completion
                      threshold: 0.8
                    - metric_key: agent.tool_correctness
                      threshold: 0.8
                  name: Support-Agent-Regressions
                  webhook:
                    event_types:
                      - job.succeeded
                      - job.failed
                    url: https://example.com/hooks/cortex/eval
              deepeval_custom_job:
                description: Custom GEval-style quality check with a caller-provided criterion.
                summary: DeepEval custom async job / DeepEval 异步自定义评测
                value:
                  engine_id: deepeval
                  eval_type: custom
                  input:
                    test_cases:
                      - actual_output: Cortex Parse converts web pages and files into Markdown with normalized
                          metadata.
                        expected_output: Cortex Parse should mention Markdown and standardized metadata.
                        user_input: Explain Cortex Parse in one sentence.
                    type: inline_test_cases
                  metrics:
                    - metric_key: quality.correctness
                      params:
                        criteria: Score whether the answer correctly explains the business purpose of
                          Cortex Parse.
                      threshold: 0.8
                  name: swagger-custom-quality-job
                  webhook:
                    event_types:
                      - job.succeeded
                      - job.failed
                    url: https://example.com/hooks/cortex/eval
              evalscope_perf_job:
                description: Recommended async submission for larger performance workloads.
                summary: EvalScope perf async job / EvalScope 异步性能评测
                value:
                  engine_id: evalscope
                  engine_options:
                    max_prompt_length: 2048
                    max_tokens: 2048
                    min_prompt_length: 1024
                    min_tokens: 1024
                    number:
                      - 2
                      - 2
                    parallel:
                      - 1
                      - 2
                    stream: false
                  eval_type: perf
                  input:
                    builtin_dataset_key: longalpaca
                    type: builtin_dataset
                  name: swagger-perf-job
                  target:
                    api_key: sk-xxx
                    endpoint_url: https://openrouter.ai/api/v1/chat/completions
                    model_ref: deepseek/deepseek-v4-flash
                    protocol: openai_compatible
                    timeout_seconds: 60
                    type: api
            schema:
              $ref: '#/components/schemas/EvalJobSubmitRequest'
              description: Async evaluation job request. Use this for larger datasets, agent regressions,
                or scheduled validation workloads.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalJobAccepted'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Submit an asynchronous evaluation job / 提交异步评测作业
      tags:
        - Evaluation
  /v1/eval/jobs/{jobId}/result:
    get:
      description: Returns the completed evaluation result when the async job succeeds, or a 409 job status
        payload while work is still in progress. / 异步作业成功时返回完成的评测结果，或者工作仍在进行中时返回 409 作业状态载荷。
      operationId: getEvalResult
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            title: Jobid
            type: string
      responses:
        '200':
