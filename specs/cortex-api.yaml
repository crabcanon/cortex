          title: Outputs
          type: array
        profile_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile Key
        quality_gates:
          items:
            $ref: '#/components/schemas/SynthesisQualityResult'
          title: Quality Gates
          type: array
        source_summary:
          additionalProperties: true
          title: Source Summary
          type: object
        started_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Started At
        status:
          pattern: ^(succeeded|failed|partial)$
          title: Status
          type: string
        summary:
          $ref: '#/components/schemas/SynthesisSummary'
        synthesis_run_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Synthesis Run Id
        synthesis_type:
          $ref: '#/components/schemas/SynthesisType'
        telemetry:
          anyOf:
            - $ref: '#/components/schemas/TelemetryContext'
            - type: 'null'
      required:
