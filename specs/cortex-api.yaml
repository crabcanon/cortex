            - 5
          maximum: 10
          minimum: 1
          title: Priority
          type: integer
        scene:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional high-level parse scene. Best default: omit to let Cortex select the engine''s
            default scene. Typical values include `balanced`, `deep_web`, `authenticated_web`, `fast_extract`,
            `document_fidelity`, `document_ai`, or `lightweight`.'
          examples:
            - deep_web
          title: Scene
        sources:
          description: Required source locators. Each item may be an HTTP(S) URL, `s3://` URI, `file://`
            URI, raw Cortex storage object key such as `cortex-local/tenant_demo/obj_.../file.pdf`, or
            `cortex://objects/{object_id}` reference. For Cortex-managed S3/MinIO keys, Cortex extracts
            the `obj_...` segment and resolves a signed download URL automatically.
          examples:
            - - https://docs.cognee.ai/core-concepts/overview
              - s3://cortex-local/tenant_demo/obj_a3da967e3ca446cab3631bb7/bofa_note.pdf
          items:
            type: string
          minItems: 1
          title: Sources
          type: array
        webhook:
          anyOf:
            - $ref: '#/components/schemas/WebhookConfig'
            - type: 'null'
          description: 'Optional webhook callback configuration. Best default: omit.'
      required:
        - sources
      title: ParseJobSubmitRequest
      type: object
