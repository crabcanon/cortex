global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: cortex-api-host
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
