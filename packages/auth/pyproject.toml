[project]
name = "cortex-auth"
version = "0.1.0"
description = "Authorization and identity services for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "cortex-common",
  "cortex-db",
  "cortex-domain",
  "cortex-observability",
  "httpx>=0.28,<0.29",
  "PyJWT>=2.10,<3",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
