            type: string
        - description: 'Signed URL lifetime in seconds. Best default: 900 (15 minutes).'
          in: query
          name: ttl_seconds
          required: false
          schema:
            default: 900
            description: 'Signed URL lifetime in seconds. Best default: 900 (15 minutes).'
            examples:
