  /v1/eval/sync:
    post:
      description: Runs a small evaluation workload synchronously. Recommended for smoke checks, profile
        tuning, and low-cardinality datasets; larger workloads should use `/v1/eval/jobs`. / 同步运行小型评测工作负载。建议用于冒烟检查、配置调优和低基数数据集；较大的工作负载应使用
        `/v1/eval/jobs`。
      operationId: runEvaluationSync
      requestBody:
        content:
          application/json:
            examples:
              deepeval_multi_turn_sync:
                description: Inline multi-turn conversation evaluation for quick regression checks.
                summary: DeepEval multi-turn sync / DeepEval 多轮同步评测
                value:
                  engine_id: deepeval
                  eval_type: multi_turn
                  input:
                    test_cases:
                      - conversation_turns:
                          - content: Help me parse a PDF from storage.
                            role: user
                          - content: Upload it to Storage and submit a Parse job.
                            role: assistant
                        metadata:
                          case_id: dialog-smoke-001
                    type: inline_test_cases
                  metrics:
                    - metric_key: dialog.conversation_relevancy
                      threshold: 0.75
                    - metric_key: dialog.conversation_completeness
                      threshold: 0.75
                  name: swagger-dialog-smoke
              evalscope_perf_sync:
                description: Long-prompt OpenAI-compatible performance request routed to EvalScope. Replace
                  `api_key` with a real OpenRouter or compatible provider key.
                summary: EvalScope perf sync / EvalScope 性能同步评测
                value:
                  engine_id: evalscope
                  engine_options:
                    max_prompt_length: 2048
                    max_tokens: 2048
                    min_prompt_length: 1024
                    min_tokens: 1024
                    number:
                      - 2
                      - 2
                    parallel:
                      - 1
                      - 2
                    stream: false
                  eval_type: perf
                  input:
                    builtin_dataset_key: longalpaca
                    type: builtin_dataset
                  name: swagger-perf-job
                  target:
                    api_key: sk-xxx
                    endpoint_url: https://openrouter.ai/api/v1/chat/completions
                    model_ref: deepseek/deepseek-v4-flash
                    protocol: openai_compatible
                    timeout_seconds: 60
                    type: api
              rag_eval:
                description: Recommended synchronous evaluation for a small RAG validation dataset.
                summary: RAG evaluation / RAG 评测
                value:
                  engine_id: auto
                  eval_type: rag
                  input:
                    dataset_id: ds_001
                    field_mapping:
                      actual_output: answer
                      retrieval_contexts: contexts
                      user_input: question
                    type: dataset
                  metrics:
                    - metric_key: rag.faithfulness
                      threshold: 0.8
                    - metric_key: rag.answer_relevance
                      threshold: 0.7
                  name: Fintech-RAG-QA-Eval
                  target:
                    endpoint_url: https://ordix.internal/v1/query
                    timeout_seconds: 30
                    type: api
            schema:
              $ref: '#/components/schemas/EvalSyncRequest'
              description: 'Unified evaluation request body. Required: `eval_type` and `input`. `engine_id`
                defaults to `auto`.'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunResult'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Execute a synchronous evaluation run / 执行同步评测运行
      tags:
        - Evaluation
