                    node_sets:
                      - docs
                    object_ids: []
                    tags:
                      - docs
                  include_graph_paths: true
                  include_provenance: true
                  only_context: false
                  query_text: What does the documentation say about Cortex parse workflows?
                  search_type: GRAPH_COMPLETION
                  timeout_seconds: 30
                  top_k: 10
              storage_object_search:
                description: Use after adding an uploaded Storage object. Replace the object id with the
                  id returned by `/v1/storage/files` when you want to narrow results.
                summary: Search storage-backed knowledge / 搜索存储来源知识
                value:
                  dataset_keys:
                    - swagger_knowledge_demo
                  filters:
                    document_ids: []
                    metadata: {}
                    node_sets:
                      - storage
                    object_ids:
                      - obj_a3da967e3ca446cab3631bb7
                    tags: []
                  include_graph_paths: false
                  include_provenance: true
                  only_context: true
                  query_text: Summarize the uploaded README or PDF.
                  search_type: CHUNKS
                  timeout_seconds: 15
                  top_k: 5
              swagger_demo_search:
                description: Run after Add and preferably after Cognify. Uses the demo dataset key from
                  the Swagger dataset example.
                summary: Runnable demo search / 可运行的演示搜索
                value:
                  dataset_keys:
                    - swagger_knowledge_demo
                  filters:
                    document_ids: []
                    metadata: {}
                    node_sets:
                      - swagger_demo
                    object_ids: []
                    tags: []
                  include_graph_paths: true
                  include_provenance: true
                  only_context: false
                  query_text: What Cortex APIs are available and what does Knowledge do?
                  search_type: GRAPH_COMPLETION
                  timeout_seconds: 30
                  top_k: 5
            schema:
              $ref: '#/components/schemas/SearchRequest'
              description: Knowledge search request. `query_text` is required; dataset scope and filters
                are optional.
        required: true
      responses:
        '200':
          content:
            application/json:
