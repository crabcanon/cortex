      type: object
    SynthesisRunResult:
      properties:
        completed_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Completed At
        engine_id:
          title: Engine Id
          type: string
        job_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Job Id
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        output_dataset_id:
