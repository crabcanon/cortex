                  only_context: true
                  query_text: OpenTelemetry integration
                  search_type: CHUNKS
                  timeout_seconds: 15
                  top_k: 5
              recommended_graph_completion:
                description: A good default search request for answering a question with graph-aware context.
                summary: Recommended graph completion search / 推荐图谱补全搜索
