  /v1/storage/uploads:
    post:
      description: Create a signed upload session for a new object. The caller supplies file identity
        plus business metadata, while Cortex infers content type when possible and decides whether multipart
        is needed. / 为新对象创建带签名的上传会话。调用方提供文件标识和业务元数据，同时 Cortex 尽可能推断内容类型，并决定是否需要分部分上传。
      operationId: createUploadSession
      requestBody:
        content:
          application/json:
            examples:
              multipart_large_file:
                description: Recommended when the client already knows the file is large enough that Cortex
                  should initialize multipart upload and return part URLs.
                summary: Multipart upload for large files / 大文件分部分上传
                value:
                  filename: quarterly-report.pdf
                  metadata:
                    department: fpna
                    source: finance-portal
                  size_bytes: 67108864
                  tags:
                    - finance
                    - quarterly
              recommended_single_part:
                description: Best for small and medium files that fit in one signed PUT request. You can
                  omit `size_bytes`; Cortex will finalize the actual object size when the upload is completed.
                summary: Recommended single-part upload / 推荐单部分上传
                value:
                  access_policy:
                    access_level: tenant_shared
                    allowed_role_keys:
                      - tenant_admin
                      - analyst
                    classification_labels:
                      - internal
                    constraints: {}
                    denied_role_keys: []
                    purpose_tags:
                      - knowledge_ingest
                  filename: README.md
                  metadata:
                    document_type: guide
                    source: swagger-demo
                  tags:
                    - docs
                    - product
            schema:
              $ref: '#/components/schemas/StorageUploadCreateRequest'
              description: Upload session creation request. `filename` is required. Cortex infers `content_type`
                from `filename` when omitted, uses `size_bytes` when available to decide single-part vs
                multipart, and manages bucket/object-key routing internally.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUploadSession'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Initiate an upload session / 发起上传会话
      tags:
        - Storage
  /v1/storage/uploads/{uploadId}/complete:
    post:
      description: Finalize a single-part or multipart upload session after the object-store transfer
        has succeeded. This step is required because Cortex must verify the uploaded object, recover provider
        metadata, and commit the final object/version records. / 在对象存储传输成功后完成单部分或分部分上传会话。此步骤是必需的，因为 Cortex
        必须验证上传的对象、恢复提供商元数据并提交最终对象/版本记录。
      operationId: completeUploadSession
      parameters:
        - description: Upload session identifier returned by `/v1/storage/uploads`.
          in: path
          name: uploadId
          required: true
          schema:
            description: Upload session identifier returned by `/v1/storage/uploads`.
            examples:
              - upl_9feeaad1935f4b478ff61d6347ee5562
            title: Uploadid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              multipart_complete:
                description: Send the uploaded part numbers and provider ETags exactly as returned by
                  the object store.
                summary: Complete a multipart upload / 完成分部分上传
                value:
                  checksum_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  parts:
                    - etag: '"part-1-etag"'
                      part_number: 1
                    - etag: '"part-2-etag"'
                      part_number: 2
                    - etag: '"part-3-etag"'
                      part_number: 3
                    - etag: '"part-4-etag"'
                      part_number: 4
              single_part_complete:
                description: Use this when the upload session returned `single_part` instead of `multipart_parts`.
                summary: Complete a single-part upload / 完成单部分上传
                value:
                  checksum_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  parts: []
            schema:
              $ref: '#/components/schemas/StorageUploadCompleteRequest'
              description: Upload completion request. Use the single-part example when no multipart parts
                were issued.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Complete an upload session / 完成上传会话
      tags:
        - Storage
