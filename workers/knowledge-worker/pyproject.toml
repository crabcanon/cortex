[project]
name = "cortex-worker-knowledge"
version = "0.1.0"
description = "Knowledge worker for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "cortex-common",
  "cortex-contracts",
  "cortex-db",
  "cortex-domain",
  "cortex-knowledge[runtime]",
]

[project.scripts]
cortex-knowledge-worker = "cortex_worker_knowledge.main:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
