  /v1/parse/sync:
    post:
      description: Synchronously parse one or more source locators into LLM-ready Markdown. The public
        contract is centered on `sources`, `engine_id`, and optional `scene`. / 将一个或多个源定位器同步解析为 LLM 就绪的
        Markdown。公共契约围绕 `sources`、`engine_id` 和可选的 `scene`。
      operationId: parseContentSync
      requestBody:
        content:
          application/json:
            examples:
              auto_web_batch_parse:
                description: Submit one or more source locators and let Cortex pick the best active engine
                  and scene automatically.
                summary: Auto-routed web batch parse / 自动路由网页批量解析
                value:
                  engine_id: auto
                  sources:
                    - https://docs.cognee.ai/core-concepts/overview
                    - https://docs.crawl4ai.com/advanced/advanced-features/
              crawl4ai_deep_web:
                description: Use Crawl4AI explicitly with the high-intensity `deep_web` scene. This keeps
                  fallback disabled and always routes the request to Crawl4AI.
                summary: Crawl4AI deep-web parse / Crawl4AI 深度网页解析
                value:
                  engine_id: crawl4ai
                  scene: deep_web
                  sources:
                    - https://docs.crawl4ai.com/advanced/advanced-features/
              minio_object_auto:
                description: Parse a Cortex-managed object stored in MinIO/S3. The locator may be the
                  storage object key, an `s3://bucket/key` URI, or `cortex://objects/{object_id}`; Cortex
                  extracts the `obj_...` id, signs a download URL, and detects MIME type.
                summary: MinIO/S3 object parse / MinIO/S3 对象解析
                value:
                  engine_id: auto
                  scene: document_ai
                  sources:
                    - s3://cortex-local/tenant_demo/obj_a3da967e3ca446cab3631bb7/bofa_note.pdf
            schema:
              $ref: '#/components/schemas/ParseSubmitRequest'
              description: 'Unified Parse request body. Required: `sources`. `engine_id` defaults to `auto`,
                and `scene` is optional.'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseBatchResult'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Parse content synchronously / 同步解析内容
      tags:
        - Parse
