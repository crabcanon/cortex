                $ref: '#/components/schemas/SearchResponse'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Search across datasets and knowledge graphs / 跨数据集和知识图谱搜索
      tags:
        - Knowledge
