        job_id:
          type: string
        job_type:
          type: string
          enum:
            - parse
            - knowledge_add
            - knowledge_cognify
            - knowledge_memify
            - eval
            - synthesis
        status:
          type: string
          enum:
            - queued
        submitted_at:
          type: string
          format: date-time
        poll_url:
          type: string
          format: uri-reference
        result_url:
          type: string
          format: uri-reference
        cancel_url:
          type: string
          format: uri-reference
        telemetry:
          $ref: '#/components/schemas/TelemetryContext'

    JobStatus:
      type: object
      required:
        - job_id
        - job_type
        - operation_name
        - status
        - submitted_at
      properties:
        job_id:
          type: string
        job_type:
          type: string
        operation_name:
          type: string
          example: parse_url
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        progress_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
        queue_name:
          type: string
        target_type:
          type: string
          example: document
        target_id:
          type: string
        correlation_id:
          type: string
        submitted_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/JobError'
        metrics:
          $ref: '#/components/schemas/JobMetrics'
        telemetry:
          $ref: '#/components/schemas/TelemetryContext'

    JobError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean

    JobMetrics:
      type: object
      properties:
        queued_ms:
          type: integer
          minimum: 0
        run_ms:
          type: integer
          minimum: 0
        total_ms:
          type: integer
          minimum: 0

    JobEventList:
      type: object
      required:
        - job_id
        - events
      properties:
        job_id:
          type: string
        events:
          type: array
