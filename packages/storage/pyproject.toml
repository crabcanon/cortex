[project]
name = "cortex-storage"
version = "0.1.0"
description = "Storage services for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.39,<2",
  "cortex-common",
  "cortex-contracts",
  "cortex-db",
  "cortex-domain",
  "cortex-observability",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
