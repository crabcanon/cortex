  CORTEX_PORT: "8080"
  CORTEX_DB_DSN: ${CORTEX_DB_DSN:?Set CORTEX_DB_DSN for production deployments.}
  CORTEX_S3_ENDPOINT: ${CORTEX_S3_ENDPOINT:?Set CORTEX_S3_ENDPOINT for production deployments.}
  CORTEX_S3_PUBLIC_ENDPOINT: ${CORTEX_S3_PUBLIC_ENDPOINT:-}
  CORTEX_S3_REGION: ${CORTEX_S3_REGION:-us-east-1}
  CORTEX_S3_BUCKET: ${CORTEX_S3_BUCKET:?Set CORTEX_S3_BUCKET for production deployments.}
  CORTEX_S3_ACCESS_KEY: ${CORTEX_S3_ACCESS_KEY:?Set CORTEX_S3_ACCESS_KEY for production deployments.}
  CORTEX_S3_SECRET_KEY: ${CORTEX_S3_SECRET_KEY:?Set CORTEX_S3_SECRET_KEY for production deployments.}
  CORTEX_S3_FORCE_PATH_STYLE: ${CORTEX_S3_FORCE_PATH_STYLE:-false}
  CORTEX_S3_AUTO_CREATE_BUCKET: ${CORTEX_S3_AUTO_CREATE_BUCKET:-false}
  CORTEX_STORAGE_DIRECT_UPLOAD_MAX_BYTES: ${CORTEX_STORAGE_DIRECT_UPLOAD_MAX_BYTES:-52428800}
  CORTEX_QUEUE_URL: ${CORTEX_QUEUE_URL:?Set CORTEX_QUEUE_URL for production deployments.}
  CORTEX_AUTH_MODE: ${CORTEX_AUTH_MODE:-oidc}
  CORTEX_OIDC_ISSUER: ${CORTEX_OIDC_ISSUER:-}
  CORTEX_OIDC_AUDIENCE: ${CORTEX_OIDC_AUDIENCE:-cortex-api}
  CORTEX_AUTH_JWT_ALGORITHM: ${CORTEX_AUTH_JWT_ALGORITHM:-RS256}
  CORTEX_AUTH_JWT_SHARED_SECRET: ${CORTEX_AUTH_JWT_SHARED_SECRET:-}
  CORTEX_AUTH_JWKS_URL: ${CORTEX_AUTH_JWKS_URL:-}
  CORTEX_AUTH_INTROSPECTION_URL: ${CORTEX_AUTH_INTROSPECTION_URL:-}
  CORTEX_AUTH_INTROSPECTION_CLIENT_ID: ${CORTEX_AUTH_INTROSPECTION_CLIENT_ID:-}
  CORTEX_AUTH_INTROSPECTION_CLIENT_SECRET: ${CORTEX_AUTH_INTROSPECTION_CLIENT_SECRET:-}
  CORTEX_AUTH_AUTO_PROVISION_PRINCIPALS: ${CORTEX_AUTH_AUTO_PROVISION_PRINCIPALS:-false}
  CORTEX_RUNTIME_CONFIG_PATH: ${CORTEX_RUNTIME_CONFIG_PATH:-configs/cortex.runtime.prod.yaml}
  CORTEX_CRAWL4AI_SKIP_PROBE: ${CORTEX_CRAWL4AI_SKIP_PROBE:-0}
  CORTEX_CRAWL4AI_INSTALL_IF_MISSING: ${CORTEX_CRAWL4AI_INSTALL_IF_MISSING:-0}
  CORTEX_CRAWL4AI_WITH_DEPS: ${CORTEX_CRAWL4AI_WITH_DEPS:-0}
  CORTEX_PLAYWRIGHT_BROWSERS_PATH: ${CORTEX_PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
  CORTEX_CRAWL4AI_BASE_DIRECTORY: ${CORTEX_CRAWL4AI_BASE_DIRECTORY:-}
  CORTEX_OTEL_ENABLED: ${CORTEX_OTEL_ENABLED:-true}
  CORTEX_OTEL_EXPORTER_OTLP_ENDPOINT: ${CORTEX_OTEL_EXPORTER_OTLP_ENDPOINT:?Set CORTEX_OTEL_EXPORTER_OTLP_ENDPOINT for production deployments.}
  CORTEX_DEPLOYMENT_ENV: ${CORTEX_DEPLOYMENT_ENV:-prod}
  CORTEX_REGION: ${CORTEX_REGION:-global}
  CORTEX_CLUSTER: ${CORTEX_CLUSTER:-cortex-prod}
  CORTEX_CRAWL4AI_PROXY: ${CORTEX_CRAWL4AI_PROXY:-}
  CORTEX_PARSE_WORKER_LEASE_SECONDS: ${CORTEX_PARSE_WORKER_LEASE_SECONDS:-300}
  CORTEX_PARSE_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${CORTEX_PARSE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
  CORTEX_PARSE_WORKER_EXECUTION_TIMEOUT_SECONDS: ${CORTEX_PARSE_WORKER_EXECUTION_TIMEOUT_SECONDS:-}
  CORTEX_KNOWLEDGE_WORKER_LEASE_SECONDS: ${CORTEX_KNOWLEDGE_WORKER_LEASE_SECONDS:-300}
  CORTEX_KNOWLEDGE_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${CORTEX_KNOWLEDGE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
  CORTEX_EVALUATION_WORKER_LEASE_SECONDS: ${CORTEX_EVALUATION_WORKER_LEASE_SECONDS:-300}
  CORTEX_EVALUATION_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${CORTEX_EVALUATION_WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
  CORTEX_SYNTHESIS_WORKER_LEASE_SECONDS: ${CORTEX_SYNTHESIS_WORKER_LEASE_SECONDS:-300}
  CORTEX_SYNTHESIS_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${CORTEX_SYNTHESIS_WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
  CORTEX_EVALUATION_WORKER_LOOP_SLEEP_SECONDS: ${CORTEX_EVALUATION_WORKER_LOOP_SLEEP_SECONDS:-1}
  CORTEX_SYNTHESIS_WORKER_LOOP_SLEEP_SECONDS: ${CORTEX_SYNTHESIS_WORKER_LOOP_SLEEP_SECONDS:-1}
  JINA_API_KEY: ${JINA_API_KEY:-}
  LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL_ID: ${OPENAI_MODEL_ID:-}
  OPENAI_EMBEDDING_MODEL_ID: ${OPENAI_EMBEDDING_MODEL_ID:-}
  OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-}
  GEMINI_EMBEDDING_MODEL_ID: ${GEMINI_EMBEDDING_MODEL_ID:-}
  GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-}
  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_MODEL_ID: ${QWEN_MODEL_ID:-}
  QWEN_EMBEDDING_MODEL_ID: ${QWEN_EMBEDDING_MODEL_ID:-}
  QWEN_EMBEDDING_DIMENSIONS: ${QWEN_EMBEDDING_DIMENSIONS:-}
  KIMI_BASE_URL: ${KIMI_BASE_URL:-}
  KIMI_API_KEY: ${KIMI_API_KEY:-}
  KIMI_MODEL_ID: ${KIMI_MODEL_ID:-}
  KIMI_EMBEDDING_MODEL_ID: ${KIMI_EMBEDDING_MODEL_ID:-}
  KIMI_EMBEDDING_DIMENSIONS: ${KIMI_EMBEDDING_DIMENSIONS:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL_ID: ${OPENROUTER_MODEL_ID:-}
  OPENROUTER_EMBEDDING_MODEL_ID: ${OPENROUTER_EMBEDDING_MODEL_ID:-}
  OPENROUTER_EMBEDDING_DIMENSIONS: ${OPENROUTER_EMBEDDING_DIMENSIONS:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OLLAMA_MODEL_ID: ${OLLAMA_MODEL_ID:-}
  OLLAMA_EMBEDDING_MODEL_ID: ${OLLAMA_EMBEDDING_MODEL_ID:-}
  OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-}
  LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
  LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
  LOCAL_LLM_MODEL_ID: ${LOCAL_LLM_MODEL_ID:-}
  LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-}
  LOCAL_EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,postgres,redis,minio,otel-collector,prometheus,grafana,jaeger-all-in-one,cortex-api}
  COGNEE_VECTOR_DB_URL: ${COGNEE_VECTOR_DB_URL:-}
  COGNEE_GRAPH_DB_URL: ${COGNEE_GRAPH_DB_URL:-}
  COGNEE_GRAPH_DB_USERNAME: ${COGNEE_GRAPH_DB_USERNAME:-}
  COGNEE_GRAPH_DB_PASSWORD: ${COGNEE_GRAPH_DB_PASSWORD:-}
  COGNEE_RELATIONAL_DB_URL: ${COGNEE_RELATIONAL_DB_URL:-}
  COGNEE_MIGRATION_DB_URL: ${COGNEE_MIGRATION_DB_URL:-}
  COGNEE_SKIP_CONNECTION_TEST: ${COGNEE_SKIP_CONNECTION_TEST:-false}

services:
  cortex-migrate:
    image: ${CORTEX_API_IMAGE:-ghcr.io/crabcanon/cortex-api:latest}
    profiles: ["migrate"]
    environment:
      <<: *cortex-prod-env
    entrypoint: ["/app/.venv/bin/cortex-db-migrate"]
    command: ["upgrade", "head"]
    restart: "no"
    volumes:
      - cortex-data:/app/.data

  cortex-api:
    image: ${CORTEX_API_IMAGE:-ghcr.io/crabcanon/cortex-api:latest}
    init: true
    shm_size: "1gb"
    environment:
      <<: *cortex-prod-env
    ports:
      - "${CORTEX_API_PUBLISHED_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - cortex-data:/app/.data

  cortex-parse-worker:
    image: ${CORTEX_PARSE_WORKER_IMAGE:-ghcr.io/crabcanon/cortex-parse-worker:latest}
    init: true
    shm_size: "1gb"
    environment:
      <<: *cortex-prod-env
      CORTEX_PARSE_WORKER_ENGINE_KEYS: ${CORTEX_PARSE_WORKER_ENGINE_KEYS:-crawl4ai,jina_reader,llama_parse,markitdown}
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-parse-worker-docling:
    image: ${CORTEX_PARSE_WORKER_DOCLING_IMAGE:-ghcr.io/crabcanon/cortex-parse-worker-docling:latest}
    profiles: ["docling"]
    init: true
    shm_size: "1gb"
    environment:
      <<: *cortex-prod-env
      CORTEX_RUNTIME_CONFIG_PATH: ${CORTEX_DOCLING_RUNTIME_CONFIG_PATH:-configs/cortex.runtime.docling.yaml}
      CORTEX_CRAWL4AI_SKIP_PROBE: "1"
      CORTEX_PARSE_WORKER_ENGINE_KEYS: ${CORTEX_PARSE_WORKER_DOCLING_ENGINE_KEYS:-docling}
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-knowledge-worker:
    image: ${CORTEX_KNOWLEDGE_WORKER_IMAGE:-ghcr.io/crabcanon/cortex-knowledge-worker:latest}
    environment:
      <<: *cortex-prod-env
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-evaluation-worker:
    image: ${CORTEX_EVALUATION_WORKER_IMAGE:-ghcr.io/crabcanon/cortex-evaluation-worker:latest}
    environment:
      <<: *cortex-prod-env
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-evaluation-worker-runtime:
    image: ${CORTEX_EVALUATION_WORKER_RUNTIME_IMAGE:-ghcr.io/crabcanon/cortex-evaluation-worker-runtime:latest}
    profiles: ["eval-runtime"]
    environment:
      <<: *cortex-prod-env
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-synthesis-worker:
    image: ${CORTEX_SYNTHESIS_WORKER_IMAGE:-ghcr.io/crabcanon/cortex-synthesis-worker:latest}
    environment:
      <<: *cortex-prod-env
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-synthesis-worker-runtime:
    image: ${CORTEX_SYNTHESIS_WORKER_RUNTIME_IMAGE:-ghcr.io/crabcanon/cortex-synthesis-worker-runtime:latest}
    profiles: ["synthesis-runtime"]
    environment:
      <<: *cortex-prod-env
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

volumes:
  cortex-data:
