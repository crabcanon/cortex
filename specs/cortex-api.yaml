  /v1/eval/sync:
    post:
      tags:
        - Evaluation
      summary: Execute a synchronous evaluation run / 执行同步评测
      description: Runs a small evaluation workload synchronously. Recommended for smoke checks, profile tuning, and low-cardinality datasets; larger workloads should use `/v1/eval/jobs`. / 以同步方式执行小规模评测，适合冒烟验证、profile 调优和低基数数据集；更大规模的评测应使用 `/v1/eval/jobs`。
      operationId: runEvaluationSync
      security:
        - OAuth2:
            - eval:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalSyncRequest'
            examples:
              ragEval:
                summary: RAG evaluation / RAG 评测
                value:
                  name: fintech-rag-regression
                  eval_type: rag
                  engine_id: auto
                  input:
                    type: dataset
                    dataset_id: ds_fintech_goldens
                    field_mapping:
                      user_input: question
                      actual_output: answer
                      expected_output: ground_truth
                      retrieval_contexts: contexts
                  target:
                    type: api
                    protocol: openai_compatible
                    endpoint_url: https://ordix.internal/v1/query
                    auth_ref: vault:cortex/eval/ordix
                    timeout_seconds: 45
                  metrics:
                    - metric_key: rag.faithfulness
                      threshold: 0.8
                    - metric_key: rag.answer_relevance
                      threshold: 0.75
              deepevalMultiTurn:
                summary: DeepEval multi-turn sync / DeepEval 多轮同步评测
                value:
                  name: swagger-dialog-smoke
                  eval_type: multi_turn
                  engine_id: deepeval
                  input:
                    type: inline_test_cases
                    test_cases:
                      - conversation_turns:
                          - role: user
                            content: Help me parse a PDF from storage.
                          - role: assistant
                            content: Upload it to Storage and submit a Parse job.
                        metadata:
                          case_id: dialog-smoke-001
                  metrics:
                    - metric_key: dialog.conversation_relevancy
                      threshold: 0.75
                    - metric_key: dialog.conversation_completeness
                      threshold: 0.75
              evalscopePerfSync:
                summary: EvalScope perf sync / EvalScope 性能同步评测
                value:
                  name: swagger-perf-smoke
                  eval_type: perf
                  engine_id: evalscope
                  input:
                    type: builtin_dataset
                    builtin_dataset_key: openqa
                  target:
                    type: api
                    endpoint_url: http://127.0.0.1:8080/v1/health/ready
                    timeout_seconds: 30
                  metrics:
                    - metric_key: perf.qps
                      threshold: 1.0
                    - metric_key: perf.p90_latency
                      threshold: 2.0
                  engine_options:
                    parallel:
                      - 1
                    number:
                      - 5
                    stream: false
      responses:
        '200':
          description: Evaluation completed within the sync budget. / 在同步预算内完成评测。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/eval/jobs:
    post:
      tags:
        - Evaluation
      summary: Submit an asynchronous evaluation job / 提交异步评测作业
      description: Queues a long-running evaluation job for performance tests, large benchmark suites, multi-turn simulations, or any workload that exceeds the synchronous budget. / 提交长时运行的评测作业，适用于性能压测、大型 benchmark、多轮会话模拟或超出同步预算的工作负载。
      operationId: createEvalJob
      security:
        - OAuth2:
            - eval:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalJobSubmitRequest'
            examples:
              perfEval:
                summary: Performance evaluation / 性能评测
                value:
                  name: cortex-rag-perf-nightly
                  eval_type: perf
                  engine_id: evalscope
                  input:
                    type: builtin_dataset
                    builtin_dataset_key: openqa
                  target:
                    type: api
                    protocol: openai_compatible
                    endpoint_url: https://gateway.internal/v1/chat/completions
                    auth_ref: vault:cortex/eval/gateway
                    timeout_seconds: 120
                  metrics:
                    - metric_key: perf.p99_latency
                      threshold: 2.0
                    - metric_key: perf.ttft
                      threshold: 1.2
                    - metric_key: perf.output_tokens_per_second
                      threshold: 150.0
                  engine_options:
                    parallel:
                      - 8
                      - 16
                    number:
                      - 200
                      - 400
                    rate: 25
                    stream: true
                  webhook:
                    url: https://example.com/hooks/cortex/eval
                    secret_ref: vault:cortex/webhooks/eval
              deepevalAgenticJob:
                summary: DeepEval agentic async job / DeepEval 异步 Agent 评测
                value:
                  name: support-agent-regressions
                  eval_type: agentic
                  engine_id: deepeval
                  input:
                    type: inline_test_cases
                    test_cases:
                      - user_input: Create a parse job for an uploaded PDF.
                        actual_output: Called storage lookup, selected docling, and submitted a parse job.
                        expected_output: The agent should use storage metadata and submit a docling parse job.
                        retrieval_contexts:
                          - Parse jobs support engine_id=docling and object-backed sources.
                        metadata:
                          case_id: agent-001
                          tools_called:
                            - storage.get
                            - parse.jobs.create
                  metrics:
                    - metric_key: agent.task_completion
                      threshold: 0.8
                    - metric_key: agent.tool_correctness
                      threshold: 0.8
              deepevalCustomJob:
                summary: DeepEval custom async job / DeepEval 异步自定义评测
                value:
                  name: swagger-custom-quality-job
                  eval_type: custom
                  engine_id: deepeval
                  input:
                    type: inline_test_cases
                    test_cases:
                      - user_input: Explain Cortex Parse in one sentence.
                        actual_output: Cortex Parse converts web pages and files into Markdown with normalized metadata.
                        expected_output: Cortex Parse should mention Markdown and standardized metadata.
                  metrics:
                    - metric_key: quality.correctness
                      threshold: 0.8
                      params:
                        criteria: Score whether the answer correctly explains the business purpose of Cortex Parse.
      responses:
        '202':
          description: Evaluation job accepted. / 已接受评测作业。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalJobAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/eval/jobs/{jobId}/result:
    get:
      tags:
        - Evaluation
      summary: Get a completed evaluation result / 获取已完成的评测结果
      description: Returns the completed evaluation result for a finished evaluation job. / 返回指定评测作业的最终结果。
      operationId: getEvalResult
      security:
        - OAuth2:
            - eval:read
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Completed evaluation result. / 已完成的评测结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Evaluation result is not ready yet. / 评测结果尚未就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        default:
          $ref: '#/components/responses/ErrorResponse'

