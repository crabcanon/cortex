[project]
name = "cortex-api"
version = "0.1.0"
description = "FastAPI control plane for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<0.36",
]

[project.scripts]
cortex-api = "cortex_api.main:run"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
