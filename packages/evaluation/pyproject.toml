[project]
name = "cortex-evaluation"
version = "0.1.0"
description = "Evaluation orchestration for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "cortex-common",
  "cortex-contracts",
  "cortex-db",
  "cortex-domain",
  "cortex-observability",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
deepeval = [
  "deepeval>=3.9,<4",
]
evalscope = [
  "evalscope[service]>=1.6,<2",
]
runtime = [
  "deepeval>=3.9,<4",
  "evalscope[service]>=1.6,<2",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
