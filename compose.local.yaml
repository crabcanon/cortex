  COGNEE_SKIP_CONNECTION_TEST: ${COGNEE_SKIP_CONNECTION_TEST:-true}

x-cortex-runtime-config-volume: &cortex-runtime-config-volume ./configs:/app/configs:ro

x-cortex-extra-hosts: &cortex-extra-hosts
  - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s

  jaeger-all-in-one:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4319:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CORTEX_DEPLOYMENT_ENV: local
      CORTEX_REGION: local
      CORTEX_CLUSTER: docker-compose
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
      - "1777:1777"
      # zPages stays container-internal. Windows may reserve/forbid host port
      # 55679, which can stop the whole local stack from starting.
    depends_on:
      - jaeger-all-in-one
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    volumes:
      - ./scripts/dev/prometheus.local.yaml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger-all-in-one
    volumes:
      - grafana-data:/var/lib/grafana
      - ./scripts/dev/grafana/datasources:/etc/grafana/provisioning/datasources:ro

  cortex-migrate:
    image: cortex-api:local
    build: *cortex-build-api
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
    entrypoint: ["/app/.venv/bin/cortex-db-migrate"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-api:
    image: cortex-api:local
    build: *cortex-build-api
    init: true
    shm_size: "1gb"
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-parse-worker:
    image: cortex-parse-worker:local
    build: *cortex-build-parse-worker
    init: true
    shm_size: "1gb"
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
      CORTEX_PARSE_WORKER_ENGINE_KEYS: crawl4ai,jina_reader,llama_parse,markitdown
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-parse-worker-docling:
    image: cortex-parse-worker-docling:local
    build: *cortex-build-parse-worker-docling
    profiles: ["docling"]
    init: true
    shm_size: "1gb"
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
      CORTEX_PARSE_WORKER_ENGINE_KEYS: docling
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-knowledge-worker:
    image: cortex-knowledge-worker:local
    build: *cortex-build-knowledge-worker
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-evaluation-worker:
    image: cortex-evaluation-worker:local
    build: *cortex-build-evaluation-worker
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-evaluation-worker-runtime:
    image: cortex-evaluation-worker-runtime:local
    build: *cortex-build-evaluation-worker-runtime
    profiles: ["eval-runtime"]
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-synthesis-worker:
    image: cortex-synthesis-worker:local
    build: *cortex-build-synthesis-worker
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

  cortex-synthesis-worker-runtime:
    image: cortex-synthesis-worker-runtime:local
    build: *cortex-build-synthesis-worker-runtime
    profiles: ["synthesis-runtime"]
    extra_hosts: *cortex-extra-hosts
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data
      - *cortex-runtime-config-volume

volumes:
  postgres-data:
  minio-data:
  grafana-data:
  cortex-data:
