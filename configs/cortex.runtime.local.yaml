schema_version: cortex.runtime.v1

parse:
  default_profile_ref: auto_default
  engines:
    crawl4ai:
      enabled: true
      browser_config:
        browser_type: chromium
        headless: true
        enable_stealth: false
        use_persistent_context: false
      crawler_run_config:
        cache_mode: bypass
        remove_overlay_elements: true
        check_robots_txt: true
        verbose: false
      proxy_ref: env:CORTEX_CRAWL4AI_PROXY
      storage_state_ref: path:../secrets/crawl4ai/local/storage_state.json

    jina_reader:
      enabled: true
      base_url: https://r.jina.ai
      timeout_seconds: 45
      use_readerlm_v2: true
      headers: {}
      api_key_ref: env:JINA_API_KEY

    llama_parse:
      enabled: true
      mode: cloud_api
      api_key_ref: env:LLAMA_CLOUD_API_KEY
      options:
        result_type: markdown
        verbose: false

    markitdown:
      enabled: true
      options: {}

    docling:
      enabled: true
      converter_options: {}
      convert_options: {}

knowledge:
  provider: cognee
  cognee:
    enabled: true
    monitoring_tool: noop
    system_root_directory: ../.data/cognee/local/system
    data_root_directory: ../.data/cognee/local/data

    llm:
      llm_provider: openai
      llm_model: gpt-5.4-mini
      llm_api_key_ref: env:OPENAI_API_KEY

    embedding:
      embedding_provider: openai
      embedding_model: openai/text-embedding-3-large
      embedding_dimensions: 3072
      embedding_api_key_ref: env:OPENAI_API_KEY

    vector_db:
      vector_db_provider: lancedb
      vector_db_url_ref: path:../.data/cognee/local/vector

    graph_db:
      graph_database_provider: kuzu

    relational_db:
      db_provider: sqlite
      db_url: sqlite:///./.data/cognee/local/cognee.sqlite

    migration_db:
      db_provider: sqlite
      db_url: sqlite:///./.data/cognee/local/cognee.sqlite
