                    type: documents
                  synthesis_type: conversation_goldens
                  webhook:
                    event_types:
                      - job.succeeded
                      - job.failed
                    url: https://example.com/hooks/cortex/synthesis
              qa_pairs_job:
                description: Recommended async submission for larger synthetic dataset generation workloads.
                summary: QA pairs synthesis job / QA 对生成作业
                value:
                  config:
                    quality_gates:
                      - metric_key: quality.correctness
                        threshold: 0.8
                    sample_count: 100
                  engine_id: auto
                  name: Product-QA-Synth
                  output:
                    output_format: jsonl
                  source:
                    inline_records:
                      - document: Cortex supports pluggable evaluation and synthesis engines.
                    type: inline_records
                  synthesis_type: qa_pairs
                  webhook:
                    event_types:
                      - job.succeeded
                      - job.failed
                    url: https://example.com/hooks/cortex/synthesis
              sdv_relational_job:
                description: Async relational synthesis from inline table samples. This example is designed
                  for local Swagger testing with the runtime synthesis worker.
                summary: SDV relational async job / SDV 关系型异步合成
                value:
                  config:
                    anonymize_pii: true
                    sample_count: 3
                  engine_id: sdv
                  name: swagger-sdv-orders
                  output:
                    include_preview: true
                    output_format: jsonl
                  source:
                    options:
                      tables:
                        customers:
                          - customer_id: c1
                            tier: gold
                          - customer_id: c2
                            tier: silver
                        orders:
                          - amount: 99
                            customer_id: c1
                            order_id: o1
                          - amount: 42
                            customer_id: c2
                            order_id: o2
                    type: relational_metadata
                  synthesis_type: structured_relational
            schema:
              $ref: '#/components/schemas/SynthesisJobSubmitRequest'
              description: Async synthesis job request. Use this for larger synthetic dataset creation
                or batch enrichment workloads.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynthesisJobAccepted'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Submit an asynchronous synthesis job / 提交异步合成作业
      tags:
        - Synthesis
  /v1/synthesis/jobs/{jobId}/result:
    get:
      description: Returns the completed synthesis result when the async job succeeds, or a 409 job status
        payload while work is still in progress. / 异步作业成功时返回完成的合成结果，或者工作仍在进行中时返回 409 作业状态载荷。
      operationId: getSynthesisResult
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            title: Jobid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/SynthesisRunResult'
                  - $ref: '#/components/schemas/JobStatusDetail'
                title: Response Getsynthesisresult
          description: Successful Response / 成功响应
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusDetail'
          description: Conflict / 冲突 / 冲突
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Get a completed synthesis result / 获取完成的合成结果
      tags:
        - Synthesis
  /v1/synthesis/sync:
    post:
      description: Runs a small synthesis workload synchronously. Recommended for preview generation,
        quality-gate tuning, and low-cardinality source samples. / 同步运行小型合成工作负载。建议用于预览生成、质量门控调优和低基数源样本。
      operationId: runSynthesisSync
      requestBody:
        content:
          application/json:
            examples:
              deepeval_qa_pairs:
                description: Generate a tiny QA preview from inline document context.
                summary: DeepEval QA sync / DeepEval QA 同步合成
                value:
                  config:
                    include_expected_output: true
                    max_contexts_per_case: 1
                    sample_count: 2
                  engine_id: deepeval
                  name: swagger-qa-preview
                  output:
                    include_preview: true
                    output_format: json
                  source:
                    documents:
                      - Cortex Parse turns URLs and storage objects into LLM-ready Markdown.
                    type: documents
                  synthesis_type: qa_pairs
              rag_goldens:
                description: Generate a small synchronous preview set of RAG golden samples from documents.
                summary: RAG goldens synthesis / RAG 黄金集生成
                value:
                  config:
                    quality_gates:
                      - metric_key: quality.correctness
                        threshold: 0.8
                    sample_count: 5
                  engine_id: auto
                  name: Support-RAG-Goldens
                  output:
                    output_format: json
                  source:
                    documents:
                      - Cortex exposes Parse, Storage, Knowledge, Evaluation, and Synthesis APIs.
                    type: documents
                  synthesis_type: rag_goldens
              sdv_single_table:
                description: Generate a small structured preview from inline records. Requires the SDV
                  runtime dependency for synchronous execution.
                summary: SDV single-table sync / SDV 单表同步合成
                value:
                  config:
                    anonymize_pii: true
                    quality_gates:
                      - metric_key: quality.row_count_match
                        threshold: 1
                    sample_count: 5
                  engine_id: sdv
                  name: swagger-sdv-customers
                  output:
                    include_preview: true
                    output_format: json
                  source:
                    inline_records:
                      - customer_id: c1
                        monthly_spend: 1200
                        tier: gold
                      - customer_id: c2
                        monthly_spend: 300
                        tier: silver
                    options:
                      table_name: customers
                    type: inline_records
                  synthesis_type: structured_single_table
            schema:
              $ref: '#/components/schemas/SynthesisSyncRequest'
              description: 'Unified synthesis request body. Required: `synthesis_type` and `source`. `engine_id`
                defaults to `auto`.'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynthesisRunResult'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Execute a synchronous synthesis run / 执行同步合成运行
      tags:
        - Synthesis
servers:
  - description: Production / 生产环境
    url: https://api.cortex.com
  - description: Development / 测试环境
    url: ' https://dev.cortex.com'
tags:
  - description: 运行存活与依赖就绪探针。 / Runtime liveness and dependency readiness probes.
    name: Health
  - description: 对齐 OpenTelemetry 的遥测与指标接口。 / OpenTelemetry-aligned telemetry and metrics endpoints.
    name: Observability
  - description: 通用长任务查询与控制。 / Generic long-running job inspection and control.
    name: Jobs
  - description: 面向 URL 与文件的引擎无关解析、标准化与持久化。 / Engine-agnostic parsing, normalization, and persistence
      for URLs and files.
    name: Parse
  - description: 上传、查询和下载 S3 后端对象。 / Upload, inspect, and download S3-backed objects.
    name: Storage
  - description: Dataset lifecycle plus Cognee-backed Add, Cognify, Memify, and Search operations. / 数据集生命周期与基于
      Cognee 的 Add、Cognify、Memify、Search 操作。
    name: Knowledge
  - description: AI 评测引擎、指标目录、同步校验与异步评测作业。 / AI evaluation engines, metric catalogs, synchronous checks,
      and asynchronous evaluation jobs.
    name: Evaluation
  - description: 数据合成引擎以及同步、异步生成工作流。 / Synthetic data engines plus synchronous and asynchronous generation
      workflows.
    name: Synthesis
  - description: 仅本地开发环境启用的 token 生成辅助接口。 / Local-development-only token issuance helper.
    name: Dev Auth
