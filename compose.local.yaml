x-cortex-build-api: &cortex-build-api
  context: .
  target: api
  args:
    PLAYWRIGHT_PYTHON_BASE_IMAGE: ${CORTEX_PLAYWRIGHT_PYTHON_BASE_IMAGE:-mcr.microsoft.com/playwright/python:v1.58.0-noble}
    UV_IMAGE: ${CORTEX_UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.22}
    CORTEX_RUNTIME_CONFIG_PATH: configs/cortex.runtime.local.yaml
    CORTEX_PREPARE_CRAWL4AI_RUNTIME: "1"

x-cortex-build-parse-worker: &cortex-build-parse-worker
  context: .
  target: parse-worker
  args:
    PLAYWRIGHT_PYTHON_BASE_IMAGE: ${CORTEX_PLAYWRIGHT_PYTHON_BASE_IMAGE:-mcr.microsoft.com/playwright/python:v1.58.0-noble}
    UV_IMAGE: ${CORTEX_UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.22}
    CORTEX_RUNTIME_CONFIG_PATH: configs/cortex.runtime.local.yaml
    CORTEX_PREPARE_CRAWL4AI_RUNTIME: "1"

x-cortex-build-parse-worker-docling: &cortex-build-parse-worker-docling
  context: .
  target: parse-worker-docling
  args:
    PLAYWRIGHT_PYTHON_BASE_IMAGE: ${CORTEX_PLAYWRIGHT_PYTHON_BASE_IMAGE:-mcr.microsoft.com/playwright/python:v1.58.0-noble}
    UV_IMAGE: ${CORTEX_UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.22}
    CORTEX_RUNTIME_CONFIG_PATH: configs/cortex.runtime.local.yaml
    CORTEX_PREPARE_CRAWL4AI_RUNTIME: "1"

x-cortex-build-knowledge-worker: &cortex-build-knowledge-worker
  context: .
  target: knowledge-worker
  args:
    PYTHON_BASE_IMAGE: ${CORTEX_PYTHON_BASE_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
    UV_IMAGE: ${CORTEX_UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.22}
    CORTEX_RUNTIME_CONFIG_PATH: configs/cortex.runtime.local.yaml

x-cortex-env: &cortex-env
  CORTEX_ENV: local
  CORTEX_HOST: 0.0.0.0
  CORTEX_PORT: "8080"
  CORTEX_DB_DSN: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
  CORTEX_S3_ENDPOINT: http://minio:9000
  CORTEX_S3_REGION: us-east-1
  CORTEX_S3_BUCKET: cortex-local
  CORTEX_S3_ACCESS_KEY: minioadmin
  CORTEX_S3_SECRET_KEY: minioadmin
  CORTEX_S3_FORCE_PATH_STYLE: "true"
  CORTEX_S3_AUTO_CREATE_BUCKET: "true"
  CORTEX_QUEUE_URL: redis://redis:6379/0
  CORTEX_AUTH_MODE: dev
  CORTEX_AUTH_JWT_ALGORITHM: HS256
  CORTEX_AUTH_JWT_SHARED_SECRET: ${CORTEX_AUTH_JWT_SHARED_SECRET:-cortex-dev-shared-secret}
  CORTEX_AUTH_AUTO_PROVISION_PRINCIPALS: "true"
  CORTEX_RUNTIME_CONFIG_PATH: configs/cortex.runtime.local.yaml
  CORTEX_CRAWL4AI_SKIP_PROBE: "0"
  CORTEX_CRAWL4AI_INSTALL_IF_MISSING: "0"
  CORTEX_CRAWL4AI_WITH_DEPS: "0"
  CORTEX_PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  CORTEX_CRAWL4AI_BASE_DIRECTORY: ${CORTEX_CRAWL4AI_BASE_DIRECTORY:-}
  CORTEX_OTEL_ENABLED: "true"
  CORTEX_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  CORTEX_DEPLOYMENT_ENV: local
  CORTEX_REGION: local
  CORTEX_CLUSTER: docker-compose
  CORTEX_CRAWL4AI_PROXY: ${CORTEX_CRAWL4AI_PROXY:-}
  JINA_API_KEY: ${JINA_API_KEY:-}
  LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  COGNEE_VECTOR_DB_URL: ${COGNEE_VECTOR_DB_URL:-}
  COGNEE_GRAPH_DB_URL: ${COGNEE_GRAPH_DB_URL:-}
  COGNEE_GRAPH_DB_USERNAME: ${COGNEE_GRAPH_DB_USERNAME:-}
  COGNEE_GRAPH_DB_PASSWORD: ${COGNEE_GRAPH_DB_PASSWORD:-}
  COGNEE_RELATIONAL_DB_URL: ${COGNEE_RELATIONAL_DB_URL:-}
  COGNEE_MIGRATION_DB_URL: ${COGNEE_MIGRATION_DB_URL:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s

  jaeger-all-in-one:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4319:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CORTEX_DEPLOYMENT_ENV: local
      CORTEX_REGION: local
      CORTEX_CLUSTER: docker-compose
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
      - "1777:1777"
      - "55679:55679"
    depends_on:
      - jaeger-all-in-one
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    volumes:
      - ./scripts/dev/prometheus.local.yaml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger-all-in-one
    volumes:
      - grafana-data:/var/lib/grafana
      - ./scripts/dev/grafana/datasources:/etc/grafana/provisioning/datasources:ro

  cortex-migrate:
    image: cortex-api:local
    build: *cortex-build-api
    environment:
      <<: *cortex-env
    entrypoint: ["/app/.venv/bin/cortex-db-migrate"]
    command: ["upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - cortex-data:/app/.data

  cortex-api:
    image: cortex-api:local
    build: *cortex-build-api
    init: true
    shm_size: "1gb"
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - cortex-data:/app/.data

  cortex-parse-worker:
    image: cortex-parse-worker:local
    build: *cortex-build-parse-worker
    init: true
    shm_size: "1gb"
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-parse-worker-docling:
    image: cortex-parse-worker-docling:local
    build: *cortex-build-parse-worker-docling
    profiles: ["docling"]
    init: true
    shm_size: "1gb"
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

  cortex-knowledge-worker:
    image: cortex-knowledge-worker:local
    build: *cortex-build-knowledge-worker
    environment:
      <<: *cortex-env
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    volumes:
      - cortex-data:/app/.data

volumes:
  postgres-data:
  minio-data:
  grafana-data:
  cortex-data:
