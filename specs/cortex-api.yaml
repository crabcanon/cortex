            - pattern: ^[0-9a-f]{64}$
              type: string
            - type: 'null'
          description: 'Optional final SHA-256 checksum. Best default: omit unless the client validated
            the file digest.'
          examples:
            - bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          title: Checksum Sha256
        parts:
          description: 'Multipart parts to finalize. Best default: empty list for single-part uploads.'
          examples:
            - - etag: '"part-1-etag"'
                part_number: 1
          items:
            $ref: '#/components/schemas/CompletedUploadPart'
          title: Parts
          type: array
      title: StorageUploadCompleteRequest
      type: object
    StorageUploadCreateRequest:
      properties:
        access_policy:
          anyOf:
            - $ref: '#/components/schemas/AccessPolicy'
            - type: 'null'
          description: 'Optional access policy attached to the stored object. Best default: omit.'
        checksum_sha256:
          anyOf:
            - pattern: ^[0-9a-f]{64}$
              type: string
            - type: 'null'
          description: 'Optional SHA-256 checksum for integrity verification. Best default: omit if the
            client cannot compute it.'
          examples:
            - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          title: Checksum Sha256
        content_type:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional MIME type of the uploaded object. Best default: omit and let Cortex infer
            it from `filename`, then reconcile it with the object store during completion.'
          examples:
            - text/markdown
          title: Content Type
        filename:
          description: Required original filename presented to storage and downstream parsers.
          examples:
            - product-overview.md
          title: Filename
          type: string
        metadata:
          additionalProperties:
            type: string
          description: 'Optional metadata stored alongside the object. Best default: empty object.'
          examples:
            - document_type: guide
              source: swagger-demo
          title: Metadata
          type: object
        size_bytes:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          description: 'Optional total size of the upload in bytes. Best default: omit when unknown before
            upload; provide it when the client already knows the file size so Cortex can choose single-part
            vs multipart more accurately.'
          examples:
            - 20480
          title: Size Bytes
        tags:
          description: 'Optional tags used for filtering or governance. Best default: empty list.'
          examples:
            - - docs
              - product
          items:
            type: string
          title: Tags
          type: array
      required:
        - filename
      title: StorageUploadCreateRequest
      type: object
    StorageUploadSession:
      properties:
        bucket:
          anyOf:
            - type: string
            - type: 'null'
          title: Bucket
        expires_at:
          format: date-time
          title: Expires At
          type: string
        multipart_parts:
          items:
            $ref: '#/components/schemas/MultipartPartUpload'
          title: Multipart Parts
          type: array
        object_id:
          title: Object Id
          type: string
        object_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Object Key
        part_size_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Part Size Bytes
        single_part:
          anyOf:
            - $ref: '#/components/schemas/PresignedRequestDescriptor'
            - type: 'null'
        status:
          $ref: '#/components/schemas/UploadSessionStatus'
        upload_id:
          title: Upload Id
          type: string
        upload_mode:
          $ref: '#/components/schemas/UploadMode'
      required:
        - upload_id
        - object_id
        - status
        - upload_mode
        - expires_at
      title: StorageUploadSession
      type: object
    StoredArtifactRef:
      properties:
        content_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Content Type
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        format:
          anyOf:
            - type: string
            - type: 'null'
          title: Format
        label:
          title: Label
          type: string
        object_id:
          title: Object Id
          type: string
        uri:
          anyOf:
            - type: string
            - type: 'null'
          title: Uri
      required:
        - object_id
        - label
      title: StoredArtifactRef
      type: object
    SynthesisConfig:
      properties:
        anonymize_pii:
          default: false
          title: Anonymize Pii
          type: boolean
        include_expected_output:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Include Expected Output
        max_contexts_per_case:
          anyOf:
            - minimum: 1
              type: integer
            - type: 'null'
          title: Max Contexts Per Case
        options:
          additionalProperties: true
          title: Options
          type: object
        quality_gates:
          items:
            $ref: '#/components/schemas/SynthesisQualityGate'
          title: Quality Gates
          type: array
        sample_count:
          anyOf:
            - minimum: 1
              type: integer
            - type: 'null'
          title: Sample Count
      title: SynthesisConfig
      type: object
    SynthesisEngineDescriptor:
      properties:
        availability_status:
          pattern: ^(available|degraded|disabled)$
          title: Availability Status
          type: string
        default_profiles:
          items:
            type: string
          title: Default Profiles
          type: array
        display_name:
          title: Display Name
          type: string
        engine_id:
          title: Engine Id
          type: string
        notes:
          anyOf:
            - type: string
            - type: 'null'
          title: Notes
        output_formats:
          items:
            type: string
          title: Output Formats
          type: array
        provider:
          anyOf:
            - type: string
            - type: 'null'
          title: Provider
        supported_source_types:
          items:
            type: string
          title: Supported Source Types
          type: array
        supported_synthesis_types:
          items:
