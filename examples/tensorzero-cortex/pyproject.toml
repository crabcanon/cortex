[project]
name = "tensorzero-cortex-example"
version = "0.1.0"
description = "TensorZero adaptive A/B testing example over Cortex Parse, Storage, Knowledge, and Eval APIs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
tensorzero-cortex = "tensorzero_cortex.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/tensorzero_cortex"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
