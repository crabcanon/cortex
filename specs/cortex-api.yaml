  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          example: https://api.cortex.example.com/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        error_code:
          type: string
          example: invalid_request
        retryable:
          type: boolean
        trace_id:
          type: string
        span_id:
          type: string
        request_id:
          type: string
        decision_id:
          type: string
        reason_code:
          type: string
          example: insufficient_scope
        required_scopes:
          type: array
          items:
            type: string
        required_permissions:
          type: array
          items:
            type: string
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    HealthResponse:
      type: object
      required:
        - status
        - service
        - mode
        - version
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - failed
        service:
          type: string
        mode:
          type: string
          enum:
            - live
            - ready
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DependencyCheck'

    DependencyCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: relational-db
        status:
          type: string
          enum:
            - ok
            - degraded
            - failed
        latency_ms:
          type: integer
          minimum: 0
        detail:
          type: string

    AuditFields:
      type: object
      required:
        - created_at
        - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_by:
          type: string

    AccessPolicy:
      type: object
      properties:
        access_level:
          type: string
          enum:
            - tenant_private
            - tenant_shared
            - restricted
            - confidential
        owner_actor_id:
          type: string
        classification_labels:
          type: array
          items:
            type: string
        allowed_role_keys:
          type: array
          items:
            type: string
        denied_role_keys:
          type: array
          items:
            type: string
        purpose_tags:
          type: array
          items:
            type: string
        constraints:
          type: object
          additionalProperties: true

    CallerIdentity:
      type: object
      properties:
        actor_id:
          type: string
        subject:
          type: string
        actor_type:
          type: string
          enum:
            - user
            - service
            - webhook
            - system
        tenant_id:
          type: string
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        entitlements:
          type: array
          items:
            type: string

    AuthorizationDecision:
      type: object
      properties:
        decision_id:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        reason_code:
          type: string
        required_scopes:
          type: array
          items:
            type: string
        resource_type:
          type: string
        resource_id:
          type: string
        evaluated_policy_ids:
          type: array
          items:
            type: string

    TelemetryContext:
      type: object
      properties:
        trace_id:
          type: string
        span_id:
          type: string
        traceparent:
          type: string
        tracestate:
          type: string
        baggage:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
        deployment:
          $ref: '#/components/schemas/DeploymentContext'
        experiment:
          $ref: '#/components/schemas/ExperimentContext'

    DeploymentContext:
      type: object
      properties:
        service_name:
          type: string
          example: cortex-api
        service_version:
          type: string
          example: 1.0.0
        service_instance_id:
          type: string
        deployment_environment_name:
          type: string
          example: production
        deployment_ring:
          type: string
          enum:
            - blue
            - green
            - canary
            - stable
        release_channel:
          type: string
          example: experiment

    ExperimentContext:
