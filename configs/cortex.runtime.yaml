schema_version: cortex.runtime.v1

parse:
  default_profile_ref: auto_default
  engines:
    crawl4ai:
      enabled: true
      base_directory_ref: path:../.data/crawl4ai/default
      playwright_browsers_path_ref: path:../.data/playwright/default
      playwright_browser: chromium
      playwright_validate_on_startup: true
      browser_config:
        browser_type: chromium
        headless: true
        enable_stealth: false
        use_persistent_context: false
      crawler_run_config:
        cache_mode: bypass
        remove_overlay_elements: true
        check_robots_txt: true
        verbose: false
      proxy_ref: env:CORTEX_CRAWL4AI_PROXY
      storage_state_ref: path:../secrets/crawl4ai/storage_state.json
    jina_reader:
      enabled: true
      base_url: https://r.jina.ai
      timeout_seconds: 45
      use_readerlm_v2: false
      headers: {}
      api_key_ref: env:JINA_API_KEY
    llama_parse:
      enabled: false
      mode: cloud_api
      api_key_ref: env:LLAMA_CLOUD_API_KEY
      options:
        result_type: markdown
        verbose: false
    markitdown:
      enabled: true
      options: {}
    docling:
      enabled: true
      converter_options: {}
      convert_options: {}

knowledge:
  provider: cognee
  cognee:
    enabled: false
    monitoring_tool: noop
    system_root_directory: ../.data/cognee/system
    data_root_directory: ../.data/cognee/data
    llm:
      llm_model_ref: env:OPENAI_MODEL_ID
      llm_endpoint_ref: env:OPENAI_BASE_URL
      llm_api_key_ref: env:OPENAI_API_KEY
    embedding:
      embedding_model_ref: env:OPENAI_EMBEDDING_MODEL_ID
      embedding_dimensions_ref: env:OPENAI_EMBEDDING_DIMENSIONS
      embedding_endpoint_ref: env:OPENAI_BASE_URL
      embedding_api_key_ref: env:OPENAI_API_KEY
    vector_db:
      vector_db_provider: lancedb
      vector_db_url_ref: path:../.data/cognee/vector
    graph_db:
      graph_database_provider: networkx
    relational_db:
      db_provider: sqlite
      db_url: sqlite:///./.data/cognee/cognee.sqlite
    migration_db:
      db_provider: sqlite
      db_url: sqlite:///./.data/cognee/cognee.sqlite

evaluation:
  default_profile_ref: auto_default
  engines:
    deepeval:
      enabled: true
      model_ref: env:GEMINI_MODEL_ID
      api_url_ref: env:GEMINI_BASE_URL
      api_key_ref: env:GEMINI_API_KEY
      options: {}
    evalscope:
      enabled: true
      mode: self_hosted_sdk
      base_url: http://127.0.0.1:19000
      host: 127.0.0.1
      port: 19000
      debug: false
      startup_timeout_seconds: 30
      timeout_seconds: 120
      headers: {}
      options: {}

synthesis:
  default_profile_ref: auto_default
  engines:
    sdv:
      enabled: true
      options: {}
    deepeval:
      enabled: true
      model_ref: env:QWEN_MODEL_ID
      api_url_ref: env:QWEN_BASE_URL
      api_key_ref: env:QWEN_API_KEY
      options: {}
