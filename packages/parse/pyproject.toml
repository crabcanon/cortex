[project]
name = "cortex-parse"
version = "0.1.0"
description = "Parse orchestration for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "PyYAML>=6.0,<7",
  "crawl4ai>=0.7,<0.9",
  "cortex-common",
  "cortex-contracts",
  "cortex-db",
  "cortex-domain",
  "cortex-observability",
  "cortex-storage",
  "docling>=2.70,<3",
  "httpx>=0.28,<0.29",
  "llama-parse>=0.6,<0.7",
  "markitdown[all]>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
