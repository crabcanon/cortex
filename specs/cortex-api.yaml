components:
  schemas:
    AccessLevel:
      enum:
        - tenant_private
        - tenant_shared
        - restricted
        - confidential
      title: AccessLevel
      type: string
    AccessPolicy:
      properties:
        access_level:
          anyOf:
            - $ref: '#/components/schemas/AccessLevel'
            - type: 'null'
          description: 'Optional coarse-grained data access level. Best default: omit to let the service
            apply the resource-type default.'
          examples:
            - tenant_shared
        allowed_role_keys:
          description: 'Optional allow-list of roles that may access the resource. Best default: empty
            list, meaning no extra allow-list constraint.'
          examples:
            - - tenant_admin
              - analyst
          items:
            type: string
          title: Allowed Role Keys
          type: array
        classification_labels:
          description: 'Optional classification labels such as `internal` or `restricted`. Best default:
            empty list.'
          examples:
            - - internal
              - docs
          items:
            type: string
          title: Classification Labels
          type: array
        constraints:
          additionalProperties: true
          description: 'Optional structured constraints for custom policy engines. Best default: empty
            object.'
          examples:
            - region: cn-shanghai
          title: Constraints
          type: object
        denied_role_keys:
          description: 'Optional deny-list of roles that should be blocked even if other checks pass.
            Best default: empty list.'
          examples:
            - - contractor
          items:
            type: string
          title: Denied Role Keys
          type: array
        owner_actor_id:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional resource owner actor ID. Best default: omit to let the service infer
            ownership from the caller.'
          examples:
            - alice
          title: Owner Actor Id
        purpose_tags:
          description: 'Optional intended-use tags for ABAC policy evaluation. Best default: empty list.'
          examples:
            - - knowledge_ingest
              - assistant
          items:
            type: string
          title: Purpose Tags
          type: array
      title: AccessPolicy
      type: object
    AddJobRequest:
      properties:
        dataset_id:
          anyOf:
            - type: string
            - type: 'null'
          description: Optional dataset ID. Provide either `dataset_id` or `dataset_key`.
          examples:
            - dset_9558cfc9178444e4a4c60d5658db78f5
          title: Dataset Id
        dataset_key:
          anyOf:
            - type: string
            - type: 'null'
          description: Optional dataset key. Recommended for human-authored requests when stable keys
            are known.
          examples:
            - product_docs
          title: Dataset Key
        inputs:
          description: Required ingest inputs. At least one input is required.
          items:
            $ref: '#/components/schemas/KnowledgeInput'
          minItems: 1
          title: Inputs
          type: array
        options:
          $ref: '#/components/schemas/AddOptions'
          description: 'Optional ingest behavior flags. Best default: use the built-in defaults.'
        webhook:
          anyOf:
            - $ref: '#/components/schemas/WebhookConfig'
            - type: 'null'
          description: 'Optional webhook callback for job lifecycle events. Best default: omit.'
      required:
        - inputs
      title: AddJobRequest
      type: object
    AddOptions:
      properties:
        incremental:
          default: true
          description: 'Avoid reprocessing unchanged content when possible. Best default: `true`.'
          title: Incremental
          type: boolean
        normalize_text:
          default: true
          description: 'Normalize raw text before ingestion. Best default: `true`.'
          title: Normalize Text
          type: boolean
        persist_source_copy:
          default: true
          description: 'Persist a copy of the source payload when supported. Best default: `true`.'
          title: Persist Source Copy
          type: boolean
        structured_ingest:
          default: true
          description: 'Enable structured ingestion and field extraction. Best default: `true`.'
          title: Structured Ingest
          type: boolean
      title: AddOptions
      type: object
    AppliedParseEngine:
      properties:
        display_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Display Name
        engine_family:
          anyOf:
            - type: string
            - type: 'null'
          title: Engine Family
        engine_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Engine Key
        engine_version:
          anyOf:
            - type: string
            - type: 'null'
          title: Engine Version
        fallback_used:
          default: false
          title: Fallback Used
          type: boolean
        profile_ref:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile Ref
        template_ref:
          anyOf:
            - type: string
            - type: 'null'
          title: Template Ref
      title: AppliedParseEngine
      type: object
    AuditFields:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
            - type: string
            - type: 'null'
          title: Created By
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          anyOf:
            - type: string
            - type: 'null'
          title: Updated By
      required:
        - created_at
        - updated_at
      title: AuditFields
      type: object
    Body_uploadSmallFile:
      properties:
        access_policy_json:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional JSON object string matching AccessPolicy. Best default: omit for tenant_private.'
          examples:
            - '{"access_level":"tenant_shared"}'
          title: Access Policy Json
        checksum_sha256:
          anyOf:
            - pattern: ^[0-9a-f]{64}$
              type: string
            - type: 'null'
          description: Optional lowercase SHA-256 checksum. Cortex verifies it before committing object
            metadata when provided.
          examples:
            - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          title: Checksum Sha256
        file:
          contentMediaType: application/octet-stream
          description: File content to upload. Cortex derives filename, content type, and size from the
            multipart part.
          title: File
          type: string
        metadata_json:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional JSON object string for object metadata. Best default: `{}`.'
          examples:
            - '{"source":"swagger-demo","document_type":"guide"}'
          title: Metadata Json
        tags:
          anyOf:
            - type: string
            - type: 'null'
          description: 'Optional comma-separated tags or JSON array string. Best default: empty.'
          examples:
            - docs,product
          title: Tags
      required:
        - file
      title: Body_uploadSmallFile
      type: object
    ChunkingOptions:
      properties:
        enabled:
          default: true
          description: 'Whether Cortex should emit chunking hints or stored chunks. Best default: `true`.'
          title: Enabled
          type: boolean
        max_chunks:
          default: 256
          description: 'Maximum chunks emitted for one document. Best default: 256.'
          examples:
            - 256
          maximum: 10000
          minimum: 1
          title: Max Chunks
          type: integer
        overlap_tokens:
          default: 64
          description: 'Token overlap between adjacent chunks. Best default: 64.'
          examples:
            - 64
          maximum: 1024
          minimum: 0
          title: Overlap Tokens
          type: integer
        strategy:
          $ref: '#/components/schemas/ChunkingStrategy'
          default: semantic
          description: 'Chunking strategy. Best default: `semantic` for LLM-ready content.'
        target_tokens:
          default: 512
          description: 'Target token count per chunk. Best default: 512.'
          examples:
            - 512
          maximum: 4096
          minimum: 64
          title: Target Tokens
          type: integer
      title: ChunkingOptions
      type: object
    ChunkingStrategy:
      enum:
        - none
        - heading
        - semantic
        - fixed_tokens
      title: ChunkingStrategy
      type: string
    Citation:
      properties:
        chunk_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Chunk Id
        document_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Document Id
        end_offset:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: End Offset
        source_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Source Url
        start_offset:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Start Offset
      title: Citation
      type: object
    CognifyJobRequest:
      properties:
        chunking:
          $ref: '#/components/schemas/ChunkingOptions'
          description: Chunking controls used before graph creation.
        dataset_id:
          anyOf:
            - type: string
            - type: 'null'
          description: Optional dataset ID. Provide either `dataset_id` or `dataset_key`.
          examples:
            - dset_9558cfc9178444e4a4c60d5658db78f5
          title: Dataset Id
        dataset_key:
          anyOf:
            - type: string
            - type: 'null'
          description: Optional dataset key. Recommended when stable dataset keys are known.
          examples:
            - product_docs
          title: Dataset Key
        graph_prompt_profile:
          $ref: '#/components/schemas/GraphPromptProfile'
          default: default
          description: 'Prompt profile for graph extraction. Best default: `default`.'
        incremental_loading:
          default: true
          description: 'Only process newly added or changed content when possible. Best default: `true`.'
          title: Incremental Loading
          type: boolean
        webhook:
          anyOf:
            - $ref: '#/components/schemas/WebhookConfig'
            - type: 'null'
          description: 'Optional webhook callback. Best default: omit.'
      title: CognifyJobRequest
      type: object
    CompletedUploadPart:
      properties:
        etag:
          description: ETag returned by the object store after uploading the part.
          examples:
            - '"part-1-etag"'
          title: Etag
          type: string
        part_number:
          description: Multipart part number exactly as returned during upload session creation.
          examples:
            - 1
          minimum: 1
          title: Part Number
          type: integer
      required:
        - part_number
        - etag
      title: CompletedUploadPart
      type: object
    DatasetCounters:
      properties:
        chunks:
          default: 0
          minimum: 0
          title: Chunks
          type: integer
        documents:
          default: 0
          minimum: 0
          title: Documents
          type: integer
        graph_edges:
          default: 0
          minimum: 0
          title: Graph Edges
          type: integer
        graph_nodes:
          default: 0
          minimum: 0
          title: Graph Nodes
          type: integer
        objects:
          default: 0
          minimum: 0
          title: Objects
          type: integer
      title: DatasetCounters
      type: object
    DatasetRetentionClass:
      enum:
        - standard
        - durable
        - temporary
      title: DatasetRetentionClass
      type: string
    DependencyCheck:
      properties:
        detail:
          anyOf:
            - type: string
            - type: 'null'
          title: Detail
        latency_ms:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Latency Ms
        name:
          title: Name
          type: string
        status:
          title: Status
          type: string
      required:
        - name
        - status
      title: DependencyCheck
      type: object
    DocumentProvenance:
      properties:
        content_hash_sha256:
          anyOf:
            - pattern: ^[0-9a-f]{64}$
              type: string
            - type: 'null'
          title: Content Hash Sha256
        content_length_bytes:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Content Length Bytes
        fetched_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Fetched At
        final_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Final Url
        http_status:
          anyOf:
            - maximum: 599
              minimum: 100
              type: integer
            - type: 'null'
          title: Http Status
        input_kind:
          anyOf:
            - $ref: '#/components/schemas/ParseInputKind'
            - type: 'null'
        parser_version:
          anyOf:
            - type: string
            - type: 'null'
          title: Parser Version
      title: DocumentProvenance
      type: object
    DownloadDisposition:
      enum:
        - attachment
        - inline
      title: DownloadDisposition
      type: string
    DownloadUrlResponse:
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        headers:
          additionalProperties:
            type: string
          title: Headers
          type: object
        method:
          title: Method
          type: string
        object_id:
          title: Object Id
          type: string
        url:
          title: Url
          type: string
      required:
        - object_id
        - method
        - url
        - expires_at
      title: DownloadUrlResponse
      type: object
    EngineMetricBinding:
      properties:
        engine_id:
          title: Engine Id
          type: string
        native_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Native Key
        notes:
          anyOf:
            - type: string
            - type: 'null'
          title: Notes
      required:
        - engine_id
      title: EngineMetricBinding
      type: object
    EvalConversationTurn:
      properties:
        content:
          title: Content
          type: string
        role:
          title: Role
          type: string
      required:
        - role
        - content
      title: EvalConversationTurn
      type: object
    EvalEngineDescriptor:
      properties:
        availability_status:
          pattern: ^(available|degraded|disabled)$
          title: Availability Status
          type: string
        default_profiles:
          items:
            type: string
          title: Default Profiles
          type: array
        display_name:
          title: Display Name
          type: string
        engine_id:
          title: Engine Id
          type: string
        execution_modes:
          items:
            type: string
          title: Execution Modes
          type: array
        notes:
          anyOf:
            - type: string
            - type: 'null'
          title: Notes
        provider:
          anyOf:
            - type: string
            - type: 'null'
          title: Provider
        supported_eval_types:
          items:
            $ref: '#/components/schemas/EvalType'
          title: Supported Eval Types
          type: array
        supported_metric_prefixes:
          items:
            type: string
          title: Supported Metric Prefixes
          type: array
      required:
        - engine_id
        - display_name
        - availability_status
      title: EvalEngineDescriptor
      type: object
    EvalEngineList:
      properties:
        engines:
          items:
            $ref: '#/components/schemas/EvalEngineDescriptor'
          title: Engines
          type: array
        generated_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Generated At
      required:
        - engines
      title: EvalEngineList
      type: object
    EvalFieldMapping:
      properties:
        actual_output:
          anyOf:
            - type: string
            - type: 'null'
          title: Actual Output
        conversation_turns:
          anyOf:
            - type: string
            - type: 'null'
          title: Conversation Turns
        expected_output:
          anyOf:
            - type: string
            - type: 'null'
          title: Expected Output
        retrieval_contexts:
          anyOf:
            - type: string
            - type: 'null'
          title: Retrieval Contexts
        user_input:
          anyOf:
            - type: string
            - type: 'null'
          title: User Input
      title: EvalFieldMapping
      type: object
    EvalInput:
      properties:
        builtin_dataset_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Builtin Dataset Key
        dataset_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Dataset Id
        dataset_version:
          anyOf:
            - type: string
            - type: 'null'
          title: Dataset Version
        field_mapping:
          anyOf:
            - $ref: '#/components/schemas/EvalFieldMapping'
            - type: 'null'
        filters:
          additionalProperties: true
          title: Filters
          type: object
        object_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Object Id
        object_ids:
          items:
            type: string
          title: Object Ids
          type: array
        test_cases:
          items:
            $ref: '#/components/schemas/EvalTestCase'
          title: Test Cases
          type: array
        trace_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Trace Session Id
        type:
          title: Type
          type: string
      required:
        - type
      title: EvalInput
      type: object
    EvalJobAccepted:
      properties:
        cancel_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Cancel Url
        engine_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Engine Id
        eval_type:
          anyOf:
            - $ref: '#/components/schemas/EvalType'
            - type: 'null'
        job_id:
          title: Job Id
          type: string
        job_type:
          $ref: '#/components/schemas/JobType'
        poll_url:
          title: Poll Url
          type: string
        result_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Result Url
        status:
          $ref: '#/components/schemas/JobStatus'
        submitted_at:
          format: date-time
          title: Submitted At
          type: string
        telemetry:
          anyOf:
            - $ref: '#/components/schemas/TelemetryContext'
            - type: 'null'
      required:
        - job_id
        - job_type
        - status
        - submitted_at
        - poll_url
      title: EvalJobAccepted
      type: object
    EvalJobSubmitRequest:
      properties:
        engine_id:
          default: auto
          title: Engine Id
          type: string
        engine_options:
          additionalProperties: true
          title: Engine Options
          type: object
        eval_type:
          $ref: '#/components/schemas/EvalType'
        input:
          $ref: '#/components/schemas/EvalInput'
        metrics:
          items:
            $ref: '#/components/schemas/EvalMetricRequest'
          title: Metrics
          type: array
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        output:
          $ref: '#/components/schemas/EvalOutputOptions'
        profile_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile Key
        target:
          anyOf:
            - $ref: '#/components/schemas/EvalTarget'
            - type: 'null'
        webhook:
          anyOf:
            - $ref: '#/components/schemas/WebhookConfig'
            - type: 'null'
      required:
        - eval_type
        - input
      title: EvalJobSubmitRequest
      type: object
    EvalMetricCatalog:
      properties:
        generated_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Generated At
        metrics:
          items:
            $ref: '#/components/schemas/EvalMetricDefinition'
          title: Metrics
          type: array
      required:
        - metrics
      title: EvalMetricCatalog
      type: object
    EvalMetricDefinition:
      properties:
        category:
          anyOf:
            - type: string
            - type: 'null'
          title: Category
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        display_name:
          title: Display Name
          type: string
        engine_bindings:
          items:
            $ref: '#/components/schemas/EngineMetricBinding'
          title: Engine Bindings
          type: array
        eval_types:
          items:
            $ref: '#/components/schemas/EvalType'
          title: Eval Types
          type: array
        metric_key:
          title: Metric Key
          type: string
        required_fields:
          items:
            type: string
          title: Required Fields
          type: array
        score_direction:
          default: higher_is_better
          title: Score Direction
          type: string
        threshold_hint:
          anyOf:
            - type: number
            - type: 'null'
          title: Threshold Hint
        unit:
          anyOf:
            - type: string
            - type: 'null'
          title: Unit
      required:
        - metric_key
        - display_name
      title: EvalMetricDefinition
      type: object
    EvalMetricRequest:
      properties:
        metric_key:
          title: Metric Key
          type: string
        params:
          additionalProperties: true
          title: Params
          type: object
        threshold:
          anyOf:
            - type: number
            - type: 'null'
          title: Threshold
        weight:
          anyOf:
            - type: number
            - type: 'null'
          title: Weight
      required:
        - metric_key
      title: EvalMetricRequest
      type: object
    EvalMetricResult:
      properties:
        details:
          additionalProperties: true
          title: Details
          type: object
        display_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Display Name
        engine_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Engine Id
        metric_key:
          title: Metric Key
          type: string
        native_metric_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Native Metric Key
        sample_size:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Sample Size
        score:
          anyOf:
            - type: number
            - type: 'null'
          title: Score
        status:
          pattern: ^(passed|failed|warn|info)$
          title: Status
          type: string
        threshold:
          anyOf:
            - type: number
            - type: 'null'
          title: Threshold
        unit:
          anyOf:
            - type: string
            - type: 'null'
          title: Unit
      required:
        - metric_key
        - status
      title: EvalMetricResult
      type: object
    EvalOutputOptions:
      properties:
        include_sample_results:
          default: true
          title: Include Sample Results
          type: boolean
        max_failures_reported:
          anyOf:
            - minimum: 1
              type: integer
            - type: 'null'
          title: Max Failures Reported
        persist_dataset_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Persist Dataset Key
        persist_report_object:
          default: true
          title: Persist Report Object
          type: boolean
      title: EvalOutputOptions
      type: object
    EvalRunResult:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/StoredArtifactRef'
          title: Artifacts
          type: array
        completed_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Completed At
        engine_id:
          title: Engine Id
          type: string
        eval_run_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Eval Run Id
        eval_type:
          $ref: '#/components/schemas/EvalType'
        job_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Job Id
        metrics:
          items:
            $ref: '#/components/schemas/EvalMetricResult'
          title: Metrics
          type: array
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        profile_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile Key
        samples:
          anyOf:
            - $ref: '#/components/schemas/EvalSampleCounters'
            - type: 'null'
        source_summary:
          additionalProperties: true
          title: Source Summary
          type: object
        started_at:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Started At
        status:
          pattern: ^(succeeded|failed|partial)$
          title: Status
          type: string
        summary:
          $ref: '#/components/schemas/EvalScoreCard'
        target_summary:
          additionalProperties: true
          title: Target Summary
          type: object
        telemetry:
          anyOf:
            - $ref: '#/components/schemas/TelemetryContext'
            - type: 'null'
      required:
        - eval_type
        - engine_id
        - status
        - summary
        - metrics
      title: EvalRunResult
      type: object
    EvalSampleCounters:
      properties:
        failed:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Failed
        passed:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Passed
        skipped:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Skipped
        total:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Total
      title: EvalSampleCounters
      type: object
    EvalScoreCard:
      properties:
        composite_score:
          anyOf:
            - type: number
            - type: 'null'
          title: Composite Score
        failed_metric_count:
          default: 0
          minimum: 0
          title: Failed Metric Count
          type: integer
