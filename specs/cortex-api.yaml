      description: Poll for the parse result. Returns `409` with job status until the parse completes,
        then returns the final `ParseResult`. / 轮询解析结果。在解析完成之前返回 `409` 作业状态，然后返回最终的 `ParseResult`。
      operationId: getParseResult
