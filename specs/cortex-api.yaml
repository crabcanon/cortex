        - source
      title: SynthesisJobSubmitRequest
      type: object
    SynthesisOutputOptions:
      properties:
        include_preview:
          default: true
          title: Include Preview
          type: boolean
        output_format:
          anyOf:
            - type: string
            - type: 'null'
          title: Output Format
        persist_dataset_key:
          anyOf:
            - type: string
            - type: 'null'
