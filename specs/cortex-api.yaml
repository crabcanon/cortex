          description: Successful Response / 成功响应
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusDetail'
          description: Conflict / 冲突 / 冲突
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Get a completed parse result / 获取完成的解析结果
      tags:
        - Parse
  /v1/parse/profiles:
    get:
      description: Return the internal parser profiles available to operators and debugging workflows.
