[project]
name = "cortex-observability"
version = "0.1.0"
description = "Observability helpers for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "cortex-common",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
