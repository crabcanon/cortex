            type: object
          title: Inline Records
          type: array
        metadata_object_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Metadata Object Id
        object_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Object Id
        object_ids:
          items:
            type: string
          title: Object Ids
          type: array
        options:
          additionalProperties: true
          title: Options
          type: object
        type:
          title: Type
          type: string
      required:
        - type
      title: SynthesisSource
      type: object
    SynthesisSummary:
      properties:
        notes:
          items:
            type: string
          title: Notes
          type: array
        output_sample_count:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Output Sample Count
        privacy_score:
          anyOf:
            - type: number
            - type: 'null'
          title: Privacy Score
        quality_score:
          anyOf:
            - type: number
            - type: 'null'
          title: Quality Score
        requested_sample_count:
          anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
          title: Requested Sample Count
      title: SynthesisSummary
      type: object
    SynthesisSyncRequest:
      properties:
        config:
          $ref: '#/components/schemas/SynthesisConfig'
        engine_id:
          default: auto
          title: Engine Id
          type: string
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        output:
          $ref: '#/components/schemas/SynthesisOutputOptions'
        profile_key:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile Key
        source:
          $ref: '#/components/schemas/SynthesisSource'
        synthesis_type:
          $ref: '#/components/schemas/SynthesisType'
        webhook:
          anyOf:
            - $ref: '#/components/schemas/WebhookConfig'
            - type: 'null'
      required:
        - synthesis_type
