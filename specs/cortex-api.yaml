        - engine_id
        - status
      title: SynthesisRunResult
      type: object
    SynthesisSource:
      properties:
        dataset_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Dataset Id
        documents:
          items:
            type: string
          title: Documents
          type: array
        field_mapping:
          additionalProperties:
            type: string
          title: Field Mapping
          type: object
        inline_records:
