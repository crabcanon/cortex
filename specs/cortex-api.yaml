openapi: 3.1.0
info:
  title: Cortex API
  version: 1.0.0-draft
  summary: Vendor-neutral APIs for parse, storage, knowledge, evaluation, and synthesis. / 面向解析、存储、知识、评测与合成的厂商中立 API。
  description: |
    Cortex exposes five first-class domains through a single contract:

    1. Parse API
    2. Storage API
    3. Knowledge API
    4. Evaluation API
    5. Synthesis API

    Shared design goals:
    - Vendor-neutrality through S3-compatible object storage and standard SQL metadata.
    - Async job execution for long-running workloads.
    - OpenTelemetry-aligned telemetry with Jaeger, Prometheus, and Grafana integration.
    - Unified authorization using OAuth scopes plus resource-level data permissions.

    Cortex 通过统一契约暴露五类核心 API：Parse、Storage、Knowledge、Evaluation、Synthesis。
    各域共享厂商中立的数据模型、统一的 Job 体系、统一权限边界，以及基于 OpenTelemetry 的可观测能力。
servers:
  - url: https://api.cortex.example.com
    description: Production / 生产环境
  - url: https://sandbox.cortex.example.com
    description: Sandbox / 沙箱环境
tags:
  - name: Health
    description: Runtime liveness and dependency readiness probes. / 运行存活与依赖就绪探针。
  - name: Observability
    description: OpenTelemetry-aligned telemetry and metrics endpoints. / 对齐 OpenTelemetry 的遥测与指标接口。
  - name: Jobs
    description: Generic long-running job inspection and control. / 通用长任务查询与控制。
  - name: Parse
    description: Engine-agnostic parsing, normalization, and persistence for URLs and files. / 面向 URL 与文件的引擎无关解析、标准化与持久化。
  - name: Storage
    description: Upload, inspect, and download S3-backed objects. / 上传、查询和下载 S3 后端对象。
  - name: Knowledge
    description: Dataset lifecycle plus Cognee-backed Add, Cognify, Memify, and Search operations. / 数据集生命周期与基于 Cognee 的 Add、Cognify、Memify、Search 操作。
  - name: Evaluation
    description: AI evaluation engines, metric catalogs, synchronous checks, and asynchronous evaluation jobs. / AI 评测引擎、指标目录、同步校验与异步评测作业。
  - name: Synthesis
    description: Synthetic data engines plus synchronous and asynchronous generation workflows. / 数据合成引擎以及同步、异步生成工作流。
  - name: Dev Auth
    description: Local-development-only token issuance helper. / 仅本地开发环境启用的 token 生成辅助接口。
security:
  - OAuth2: []
paths:
  /v1/health/live:
    get:
      tags:
        - Health
      summary: Liveness probe / 存活探针
      description: Returns the service liveness state. / 返回服务的存活状态。
      operationId: getLiveness
      security:
        - OAuth2:
            - health:read
      responses:
        '200':
          description: Service is running. / 服务运行中。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: cortex-api
                mode: live
                version: 1.0.0-draft
                timestamp: '2026-04-12T10:00:00Z'
                checks: []
        default:
          $ref: '#/components/responses/ErrorResponse'
