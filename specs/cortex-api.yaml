  /v1/parse/jobs:
    post:
      description: Queue one async parse job per source using the same unified public Parse contract.
        Add optional `priority` and `webhook` only when job control is needed. / 使用相同的统一公共 Parse 契约，为每个源排队一个异步解析作业。仅在需要作业控制时才添加可选的
        `priority` 和 `webhook`。
      operationId: createParseJob
      parameters:
        - description: 'Optional idempotency key for safely retrying asynchronous job submission. Best
            default: omit unless a client may re-send the same create request.'
          in: header
          name: Idempotency-Key
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: 'Optional idempotency key for safely retrying asynchronous job submission. Best
              default: omit unless a client may re-send the same create request.'
            examples:
              - parse-demo-001
            title: Idempotency-Key
      requestBody:
        content:
          application/json:
            examples:
              async_auto_batch_parse:
                description: Recommended when you want one async parse job per source with the same high-level
                  routing contract.
                summary: Async auto-routed batch parse / 异步自动路由批量解析
                value:
                  engine_id: auto
                  priority: 5
                  sources:
                    - https://docs.cognee.ai/core-concepts/overview
                    - s3://demo-bucket/manuals/architecture.pdf
                  webhook:
                    event_types:
                      - job.succeeded
                      - job.failed
                    headers:
                      X-Consumer: knowledge-pipeline
                    secret_ref: vault:cortex/webhooks/parse
                    url: https://example.com/hooks/cortex/parse
              async_docling_minio_pdf:
                description: Use this for PDFs uploaded through Cortex Storage. Start the `cortex-parse-worker-docling`
                  worker/profile so the job is claimed by the Docling runtime worker instead of the slim
                  parse worker.
                summary: Docling async MinIO PDF parse / Docling 异步解析 MinIO PDF
                value:
                  engine_id: docling
                  priority: 5
                  scene: document_ai
                  sources:
                    - s3://cortex-local/tenant_demo/obj_a3da967e3ca446cab3631bb7/bofa_note.pdf
              async_llamaparse_minio_pdf:
                description: Use this when the LlamaParse cloud API key is configured and the object should
                  be parsed by the cloud document parser.
                summary: LlamaParse async MinIO PDF parse / LlamaParse 异步解析 MinIO PDF
                value:
                  engine_id: llama_parse
                  priority: 5
                  scene: document_fidelity
                  sources:
                    - cortex-local/tenant_demo/obj_a3da967e3ca446cab3631bb7/bofa_note.pdf
            schema:
              $ref: '#/components/schemas/ParseJobSubmitRequest'
              description: Unified async Parse request. `sources` may contain one or more locators; `engine_id`
                defaults to `auto`.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseBatchJobAccepted'
          description: Successful Response / 成功响应
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error / 验证错误
      security:
        - BearerAuth: []
      summary: Submit an asynchronous parse job / 提交异步解析作业
      tags:
        - Parse
  /v1/parse/jobs/{jobId}/result:
