[project]
name = "cortex-db"
version = "0.1.0"
description = "Database infrastructure for Cortex."
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg>=0.30,<0.31",
  "cortex-common",
  "cortex-domain",
  "sqlalchemy>=2.0.39,<3",
  "aiosqlite>=0.21,<0.22",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
cortex-db-migrate = "cortex_db.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
